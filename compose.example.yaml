services:
  bibliothekar:
    image: ${BIBLIOTHEKAR_IMAGE:-ghcr.io/heller-adrian/bibliothekar:patch-0.29.0}
    restart: unless-stopped
    user: "568:568"

    environment:
      TZ: ${TZ:-Europe/Berlin}
      KAMERA_CONFIG: /config/settings.json
      KAMERA_WORKSPACE: /workspace
      KAMERA_DATABASE_DIR: /database
      KAMERA_LOG_DIR: /logs
      KAMERA_POOL_PROBE: /workspace
      KAMERA_ARCHIVE_ROOT: /main-library
      KAMERA_IMPORT_ROOT: /sources/import
      KAMERA_REMOVABLE_ROOT: /sources/removable
      KAMERA_NAS_SOURCE_ROOT: /sources/nas
      KAMERA_SOURCE_HELPER_URL: http://127.0.0.1:8090

    ports:
      - "${BIBLIOTHEKAR_PORT:-30044}:8080"

    volumes:
      - ${BIBLIOTHEKAR_CONFIG_DIR}:/config
      - ${BIBLIOTHEKAR_DATABASE_DIR}:/database
      - ${BIBLIOTHEKAR_LOG_DIR}:/logs
      - ${BIBLIOTHEKAR_WORKSPACE_DIR}:/workspace
      - ${BIBLIOTHEKAR_MAIN_LIBRARY_DIR}:/main-library:ro
      - ${BIBLIOTHEKAR_IMPORT_SOURCE_DIR}:/sources/import:ro
      - ${BIBLIOTHEKAR_NAS_SOURCE_DIR}:/sources/nas:ro
      - ${BIBLIOTHEKAR_REMOVABLE_DIR}:/sources/removable:ro

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

  source-helper:
    image: ${BIBLIOTHEKAR_IMAGE:-ghcr.io/heller-adrian/bibliothekar:patch-0.29.0}
    restart: unless-stopped
    user: "0:0"
    privileged: true
    pid: host
    network_mode: service:bibliothekar

    environment:
      TZ: ${TZ:-Europe/Berlin}
      KAMERA_REMOVABLE_MOUNT_ROOT: /media-sources
      KAMERA_HOST_MOUNT_ROOT: ${BIBLIOTHEKAR_REMOVABLE_DIR}

    command:
      - uvicorn
      - app.source_helper:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"

    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ${BIBLIOTHEKAR_REMOVABLE_DIR}:/media-sources:rshared

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

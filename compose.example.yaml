services:
  kamera-automatisierung:
    image: ${KAMERA_IMAGE:-ghcr.io/OWNER/kamera-automatisierung:latest}
    restart: unless-stopped
    user: "568:568"

    environment:
      TZ: ${TZ:-Europe/Berlin}
      KAMERA_CONFIG: /config/settings.json
      KAMERA_WORKSPACE: /workspace
      KAMERA_DATABASE_DIR: /database
      KAMERA_LOG_DIR: /logs
      KAMERA_ARCHIVE_ROOT: /camera-library
      KAMERA_IMPORT_ROOT: /import-sources
      KAMERA_REMOVABLE_ROOT: /removable-sources
      KAMERA_NAS_SOURCE_ROOT: /nas-sources
      KAMERA_SOURCE_HELPER_URL: http://127.0.0.1:8090

    ports:
      - "${KAMERA_PORT:-30044}:8080"

    volumes:
      - ${KAMERA_CONFIG_DIR}:/config
      - ${KAMERA_DATABASE_DIR}:/database
      - ${KAMERA_LOG_DIR}:/logs
      - ${KAMERA_WORKSPACE_DIR}:/workspace
      - ${KAMERA_LIBRARY_DIR}:/camera-library:ro
      - ${KAMERA_SD_BACKUP_DIR}:/import-sources:ro
      - ${KAMERA_REMOVABLE_DIR}:/removable-sources:ro
      - ${KAMERA_NAS_ROOT}:/nas-sources:ro

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

  source-helper:
    image: ${KAMERA_IMAGE:-ghcr.io/OWNER/kamera-automatisierung:latest}
    restart: unless-stopped
    user: "0:0"
    privileged: true
    pid: host
    network_mode: service:kamera-automatisierung

    environment:
      TZ: ${TZ:-Europe/Berlin}
      KAMERA_REMOVABLE_MOUNT_ROOT: /media-sources
      KAMERA_HOST_MOUNT_ROOT: ${KAMERA_REMOVABLE_DIR}

    command:
      - uvicorn
      - app.source_helper:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"

    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ${KAMERA_REMOVABLE_DIR}:/media-sources:rshared

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

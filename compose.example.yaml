services:
  bibliothekar:
    image: ${BIBLIOTHEKAR_IMAGE:-ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.12}
    restart: unless-stopped
    user: "0:0"

    environment:
      TZ: ${TZ:-Europe/Berlin}
      KAMERA_APPDATA: /appdata
      BIBLIOTHEKAR_ADMIN_PASSWORD: ${BIBLIOTHEKAR_ADMIN_PASSWORD:?set a password of at least 16 characters}
      BIBLIOTHEKAR_COOKIE_SECURE: ${BIBLIOTHEKAR_COOKIE_SECURE:-false}
      KAMERA_WORKSPACE: /workspace
      KAMERA_POOL_PROBE: /workspace
      KAMERA_ARCHIVE_ROOT: /main-library
      KAMERA_NAS_SOURCE_ROOT: /sources/nas
      KAMERA_SOURCE_HELPER_URL: http://127.0.0.1:8090
      KAMERA_SOURCE_HELPER_ENABLED: "false"
      KAMERA_DEVICE_NODE_ROOT: /dev/bibliothekar
      KAMERA_WEB_UID: "568"
      KAMERA_WEB_GID: "568"

    ports:
      - "${BIBLIOTHEKAR_PORT:-30044}:8080"

    volumes:
      - type: bind
        source: ${BIBLIOTHEKAR_APPDATA_DIR}
        target: /appdata
        bind:
          propagation: rprivate
          create_host_path: false
      - type: bind
        source: ${BIBLIOTHEKAR_WORKSPACE_DIR}
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${BIBLIOTHEKAR_MAIN_LIBRARY_DIR}
        target: /main-library
        read_only: true
        bind:
          create_host_path: false

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

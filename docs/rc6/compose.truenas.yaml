services:
  bibliothekar:
    image: ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.6
    restart: unless-stopped
    user: "0:0"
    privileged: true

    environment:
      TZ: Europe/Berlin
      KAMERA_CONFIG: /config/settings.json
      # BA-03: create this secret file under BIBLIOTHEKAR_CONFIG_DIR
      # before exposing the service; no default password or anonymous mode.
      BIBLIOTHEKAR_ADMIN_PASSWORD_FILE: /config/admin-password
      BIBLIOTHEKAR_COOKIE_SECURE: "false"
      KAMERA_WORKSPACE: /workspace
      KAMERA_DATABASE_DIR: /database
      KAMERA_REGISTRY_DATABASE: /database/bibliothekar-global.sqlite3
      KAMERA_LOG_DIR: /logs
      KAMERA_POOL_PROBE: /workspace
      KAMERA_ARCHIVE_ROOT: /main-library
      KAMERA_REMOVABLE_ROOT: /sources/removable
      KAMERA_NAS_SOURCE_ROOT: /sources/nas
      KAMERA_SOURCE_HELPER_URL: http://127.0.0.1:8090
      KAMERA_SOURCE_HELPER_ENABLED: "true"
      KAMERA_REMOVABLE_MOUNT_ROOT: /sources/removable
      KAMERA_DEVICE_NODE_ROOT: /dev/bibliothekar
      KAMERA_WEB_UID: "568"
      KAMERA_WEB_GID: "568"

    ports:
      - "30044:8080"

    volumes:
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/config
        target: /config
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/database
        target: /database
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/logs
        target: /logs
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/workspace
        target: /workspace
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/archive
        target: /main-library
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/nas-source
        target: /sources/nas
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/TESTPOOL/bibliothekar-rc1/removable
        target: /sources/removable
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
        bind:
          create_host_path: false

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

name: Publish frozen Bibliothekar v1.0.0-pre.6.1
on:
  push:
    branches: [codex/publish-1.0.0-pre.6.1-final]
    paths: ['.github/workflows/publish-pre61.yml']
permissions:
  contents: write
  packages: write
  actions: read
concurrency:
  group: bibliothekar-publication-pre61
  cancel-in-progress: false
jobs:
  verified-prerelease:
    if: github.repository == 'heller-adrian/Bibliothekar' && contains(github.event.head_commit.message, '[pre61-release]')
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: 2527abe3905b8ac4f5ac7d8d0507017c4cc43ac9
      QA_RUN: '41643738792'
      TAG: v1.0.0-pre.6.1
      VERSION: 1.0.0-pre.6.1
      IMAGE: ghcr.io/heller-adrian/bibliothekar:1.0.0-pre.6.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pre61-release
      - name: Verify isolated QA and exact tested source
        working-directory: pre61-release
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "heller-adrian/Bibliothekar"
          test "$GITHUB_REF" = "refs/heads/codex/publish-1.0.0-pre.6.1-final"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          for part in app tests qa Dockerfile requirements.txt requirements-rc.constraints.txt; do
            test "$(git rev-parse "$SOURCE_SHA:$part")" = "$(git rev-parse "HEAD:$part")"
          done
          grep -qx '__version__ = "1.0.0-pre.6.1"' app/__init__.py
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN" > qa-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('qa-run.json'))
          assert r['head_sha']==os.environ['SOURCE_SHA']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/qa-pre61.yml'
          assert r['run_attempt']==1
          print('PASS pinned test source and successful container gate')
          PY
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; publication refused"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; publication refused"; exit 1
          fi
      - name: Recheck regression suite on immutable release source
        working-directory: pre61-release
        run: |
          set -euo pipefail
          VENV="$(mktemp -d "$RUNNER_TEMP/pre61-venv.XXXXXXXX")"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx
          "$VENV/bin/python" -m compileall -q app
          "$VENV/bin/python" -m pytest -q \
            tests/backend/test_pre61_millisecond_burst.py \
            tests/backend/test_pre61_family_precision.py \
            tests/backend/test_pre61_export_filename.py \
            tests/backend/test_pre61_manual_rename.py \
            tests/backend/test_pre6_truenas_acceptance.py \
            tests/backend/test_0501_external_event_deletion.py
      - name: Build frozen image and run real authenticated Docker scenario
        working-directory: pre61-release
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$SOURCE_SHA" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$VERSION" -t "$IMAGE" .
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          docker run --rm --entrypoint python "$IMAGE" -c \
            'from app import __version__; assert __version__ == "1.0.0-pre.6.1"'
          mkdir -p "$RUNNER_TEMP/pre61-verified"
          GITHUB_SHA="$SOURCE_SHA" RUNNER_TEMP="$RUNNER_TEMP/pre61-verified" \
            IMAGE="$IMAGE" python3 qa/pre6/no_event_http_container.py
      - name: Publish only pre6.1 image and prerelease after all gates
        working-directory: pre61-release
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG="$RUNNER_TEMP/pre61-docker-creds"
          mkdir -p "$DOCKER_CONFIG" release-assets
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "GHCR image tag already exists; refusing replacement"; exit 1
          fi
          docker push "$IMAGE" | tee image-push.log
          DIGEST="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*/\1/p' image-push.log | tail -1)"
          test "$(printf '%s' "$DIGEST" | wc -c)" -eq 71
          docker pull "ghcr.io/heller-adrian/bibliothekar@$DIGEST"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = \
            "$(docker image inspect "ghcr.io/heller-adrian/bibliothekar@$DIGEST" --format '{{.Id}}')"
          git archive --format=tar --prefix="bibliothekar-$VERSION/" "$SOURCE_SHA" |
            gzip -n > "release-assets/bibliothekar-$VERSION-source.tar.gz"
          cp docs/pre61/RELEASE-NOTES.md release-assets/RELEASE-NOTES.md
          printf 'version=%s\nsource=%s\nqa=%s\nimage=%s@%s\n' \
            "$VERSION" "$SOURCE_SHA" "$QA_RUN" "ghcr.io/heller-adrian/bibliothekar" "$DIGEST" \
            > release-assets/PROVENANCE.txt
          (cd release-assets && sha256sum * > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "$TAG" --prerelease --latest=false \
            --notes-file release-assets/RELEASE-NOTES.md release-assets/*
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > released-tag.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('released-tag.json'))
          assert d['object']['sha']==os.environ['SOURCE_SHA']
          assert d['object']['type']=='commit'
          PY
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verified-assets
          (cd verified-assets && sha256sum -c SHA256SUMS)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
          rm -rf "$DOCKER_CONFIG"
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre61-publication-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            pre61-release/qa-run.json
            pre61-release/image-push.log
            pre61-release/released-tag.json
            pre61-release/release-assets/

name: Publish Bibliothekar RC13 prerelease
on:
  push:
    branches: [release/v1.0.0-rc.13]
    paths: [.github/workflows/publish-rc13.yml]
permissions:
  contents: write
  packages: write
  actions: read
concurrency:
  group: publish-bibliothekar-rc13
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'heller-adrian/Bibliothekar'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.13
      TAG: v1.0.0-rc.13
      ACCEPTED_SHA: 1f59167e3bfcd38928f0ad32e20d88910a15d53a
      ACCEPTED_QA: '40661973452'
      QA_SHA: fa803ca7e2435f69c6a226e46bccfab528712571
      CONTAINER_QA: '40667478387'
      CONTAINER_SHA: 1ceac829fd2481381bd0ac22b407e613ae08c2f1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful exact-source QA and private repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh api users/heller-adrian/packages/container/bibliothekar --jq '{name,visibility,package_type}' > release-assets/registry-visibility.json
          python -c "import json;d=json.load(open('release-assets/registry-visibility.json'));assert d['visibility'] in ('public','private','internal');print('Existing GHCR visibility:',d['visibility'])"
          gh api "repos/$GITHUB_REPOSITORY" --jq '{full_name,private}' > release-assets/repository-privacy.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_QA" > release-assets/accepted-QA.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_QA/jobs" > release-assets/accepted-backend-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTAINER_QA" > release-assets/accepted-container-QA.json
          python - <<'PYGATE'
          import json,os,urllib.request,urllib.error
          p=json.load(open('release-assets/repository-privacy.json'));assert p['private'] is True
          q=json.load(open('release-assets/accepted-QA.json'))
          assert q['status']=='completed' and q['head_sha']==os.environ['QA_SHA']
          jobs=json.load(open('release-assets/accepted-backend-jobs.json'))['jobs']
          required={'Targeted failure and security gate','Chromium German English mobile desktop'}|{'Complete backend ('+str(i)+')' for i in range(8)}
          assert len([j for j in jobs if j['name'] in required])==10
          assert all(next(j for j in jobs if j['name']==name)['conclusion']=='success' for name in required)
          c=json.load(open('release-assets/accepted-container-QA.json'))
          assert c['status']=='completed' and c['conclusion']=='success' and c['head_sha']==os.environ['CONTAINER_SHA']
          assert c['path']=='.github/workflows/qa-rc13-container.yml'
          assert q['path']=='.github/workflows/qa-rc13.yml'
          for resource in ['git/ref/tags/','releases/tags/']:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+resource+os.environ['TAG']
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req): pass
              except urllib.error.HTTPError as error:
                  if error.code==404:continue
                  raise
              raise RuntimeError('Existing release/tag: refusing overwrite')
          PYGATE
          git diff --quiet "$ACCEPTED_SHA" "$GITHUB_SHA" -- app tests qa Dockerfile compose.example.yaml compose.removable.yaml compose.nas-source.yaml requirements.txt requirements-rc.constraints.txt
          git diff --quiet "$QA_SHA" "$ACCEPTED_SHA" -- app tests qa Dockerfile compose.example.yaml compose.removable.yaml compose.nas-source.yaml requirements.txt requirements-rc.constraints.txt ':(exclude)qa/rc13/container.py' ':(exclude)qa/rc12/container.py'
          git diff --quiet "$CONTAINER_SHA" "$ACCEPTED_SHA" -- app tests qa Dockerfile compose.example.yaml compose.removable.yaml compose.nas-source.yaml requirements.txt requirements-rc.constraints.txt
          gh run download "$ACCEPTED_QA" --dir "$RUNNER_TEMP/rc13-accepted-evidence"
          gh run download "$CONTAINER_QA" --name rc13-container --dir "$RUNNER_TEMP/rc13-accepted-evidence/rc13-container"
          python - <<'PYQA'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'rc13-accepted-evidence'
          counts={};all_files=None;all_nodes=None;selected=[];executed=[]
          for partition in range(8):
              root=base/('rc13-backend-'+str(partition))
              manifest=json.loads((root/'rc13-partition.json').read_text())
              assert manifest['partition']==partition and manifest['partitions']==8
              if all_files is None:all_files=manifest['all_files'];all_nodes=manifest['all_nodes']
              assert manifest['all_files']==all_files and manifest['all_nodes']==all_nodes
              expected=all_nodes[partition::8]
              assert manifest['selected_nodes']==expected
              selected+=expected
              results=root/'f14-qa/targets/results'
              assert json.loads((results/'exit.json').read_text())['returncode']==0
              cases=ET.parse(results/'result.xml').findall('.//testcase')
              assert cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
              counts[str(partition)]=len(cases)
              actual=[]
              for record in results.glob('*incremental.jsonl'):
                  for row in map(json.loads,record.read_text().splitlines()):
                      assert row['outcome']=='passed',row
                      if row['phase']=='call':actual.append(row['nodeid'])
              assert sorted(actual)==expected and len(actual)==len(cases)
              executed+=actual
          assert len(selected)==len(set(selected)) and sorted(selected)==all_nodes
          assert sorted(executed)==all_nodes
          source_files=sorted(str(p) for p in Path('tests/backend').rglob('test_*.py'))
          assert all_files==source_files
          assert {node.split('::')[0] for node in all_nodes}==set(all_files)
          assert len(all_nodes)==sum(counts.values())
          targeted=base/'rc13-targeted'
          assert json.loads((targeted/'exit.json').read_text())['returncode']==0
          target_cases=list(ET.parse(targeted/'result.xml').iter('testcase'))
          assert target_cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in target_cases)
          browser=json.loads((base/'rc13-browser/results.json').read_text())
          assert browser['status']=='PASS' and len(browser['cases'])==44 and all(c['status']=='PASS' for c in browser['cases'])
          for prefix,expected in [('rc13',2),('rc12',25),('rc11',19)]:
              report=json.loads((base/'rc13-container'/(prefix+'-evidence.json')).read_text())
              assert report['source']==os.environ['CONTAINER_SHA'] and len(report['cases'])==expected
              assert all(c['status']=='PASS' for c in report['cases'])
              if prefix=='rc13':
                  assert report['native_truenas']=='NOT_RUN'
                  assert all(all(c[k] for k in ['rc12_block_reproduced','real_http_import','source_members_preserved','second_library_created','unknown_restore_no_mutation','protected_mutation_after_restart','raw_identity_preserved','readonly_bytes_preserved']) for c in report['cases'])
                  assert report['cases'][1]['crash']['uid']==568
              else:
                  assert all(all(c[k] for k in ['first_library_created','following_mutation','restarted','archives_unchanged']) for c in report['cases'])
                  assert report['native_truenas_acl']['status']=='NOT_RUN'
                  if prefix=='rc12':assert all(c['repair_restored'] and c['repair_replaced'] for c in report['cases'])
              Path('release-assets/'+prefix+'-container-QA.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('release-assets/regression-summary.json').write_text(json.dumps({'backend':sum(counts.values()),'partitions':counts,'targeted':len(target_cases),'browser':44,'container':46,'qa_sha':os.environ['QA_SHA'],'container_qa_sha':os.environ['CONTAINER_SHA'],'release_sha':os.environ['ACCEPTED_SHA']},indent=2)+'\n')
          print('Accepted complete backend:',sum(counts.values()),'Chromium:44, containers:46')
          PYQA
          git checkout --detach "$ACCEPTED_SHA"
          git rev-parse HEAD HEAD^{tree} > release-assets/source-identity.txt
          tar -czf release-assets/accepted-QA-evidence.tar.gz -C "$RUNNER_TEMP/rc13-accepted-evidence" .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing image tag or an unknown registry error
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" > "$RUNNER_TEMP/existing-rc13.out" 2> "$RUNNER_TEMP/existing-rc13.err"; then
            echo 'Existing GHCR RC13 image; refusing overwrite.' >&2
            exit 1
          fi
          if ! grep -Eiq 'not found|manifest unknown' "$RUNNER_TEMP/existing-rc13.err"; then
            cat "$RUNNER_TEMP/existing-rc13.err" >&2
            exit 1
          fi
      - name: Build accepted source and verify complete application payload
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$ACCEPTED_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c 'from app import __version__;assert __version__=="1.0.0-rc.13"'
          python - <<'PY'
          import os,json,hashlib,subprocess
          from pathlib import Path
          source={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('app').rglob('*') if p.is_file()}
          program='from pathlib import Path;import hashlib,json;r=Path("/opt/kamera");print(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (r/"app").rglob("*") if p.is_file()}))'
          image=json.loads(subprocess.check_output(['docker','run','--rm','--entrypoint','python',os.environ['IMAGE'],'-c',program],text=True))
          assert source==image
          Path('release-assets/app-sha256.json').write_text(json.dumps(source,sort_keys=True,indent=2)+'\n')
          PY
          docker image inspect "$IMAGE" --format '{{.Id}}' > "$RUNNER_TEMP/rc13-local-image-id"
      - name: Push and retrieve immutable image from registry
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee release-assets/push.log
          DIGEST="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*/\1/p' release-assets/push.log | tail -1)"
          test "${#DIGEST}" -eq 71
          REF="ghcr.io/heller-adrian/bibliothekar@$DIGEST"
          docker image rm "$IMAGE"
          docker pull "$REF" | tee release-assets/registry-pull.log
          test "$(cat "$RUNNER_TEMP/rc13-local-image-id")" = "$(docker image inspect "$REF" --format '{{.Id}}')"
          test "$(docker image inspect "$REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$ACCEPTED_SHA"
          docker run --rm --entrypoint python "$REF" -c 'from app import __version__;assert __version__=="1.0.0-rc.13"'
          printf '%s\n' "$REF" > release-assets/IMAGE-DIGEST.txt
          docker buildx imagetools inspect "$REF" --raw > release-assets/registry-manifest.json
          test "$(sha256sum release-assets/registry-manifest.json | cut -d' ' -f1)" = "${DIGEST#sha256:}"
          docker image inspect "$REF" --format '{{json .RepoDigests}}' > release-assets/registry-repodigests.json
      - name: Package source, practical manuals, digest-pinned Compose and checksums
        shell: bash
        run: |
          set -euo pipefail
          REF="$(cat release-assets/IMAGE-DIGEST.txt)"
          cp compose.example.yaml release-assets/compose.rc13.yaml
          cp compose.removable.yaml compose.nas-source.yaml release-assets/
          cp docs/rc12/compose.legacy.yaml release-assets/compose.legacy.yaml
          sed -i "s|ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.13|$REF|" release-assets/compose.rc13.yaml release-assets/compose.legacy.yaml
          sed -i "s|ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.12|$REF|" release-assets/compose.legacy.yaml
          cp docs/rc13/TRUENAS-TEST.md docs/rc13/ANALYSE.md docs/rc13/SCREENSHOTS.md docs/rc13/UPGRADE-RC12.md docs/rc13/TEST-REPORT.md docs/rc13/CI-FAILURES.md docs/rc13/RELEASE-NOTES.md release-assets/
          cp Dockerfile requirements.txt requirements-rc.constraints.txt release-assets/
          git diff --name-only v1.0.0-rc.12 "$ACCEPTED_SHA" > release-assets/CHANGED-FILES.txt
          git archive --format=tar --prefix=bibliothekar-1.0.0-rc.13/ "$ACCEPTED_SHA" | gzip -n > release-assets/bibliothekar-1.0.0-rc.13-source.tar.gz
          printf '\nContainer QA: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$CONTAINER_QA" >> release-assets/RELEASE-NOTES.md
          printf '\nAccepted source: %s\nImage: %s\nQA: https://github.com/%s/actions/runs/%s\n\nTrueNAS guide: https://github.com/%s/blob/%s/docs/rc13/TRUENAS-TEST.md\n' "$ACCEPTED_SHA" "$REF" "$GITHUB_REPOSITORY" "$ACCEPTED_QA" "$GITHUB_REPOSITORY" "$TAG" >> release-assets/RELEASE-NOTES.md
          printf '\nContainer QA: https://github.com/%s/actions/runs/%s\nContainer QA source: %s\n' "$GITHUB_REPOSITORY" "$CONTAINER_QA" "$CONTAINER_SHA" >> release-assets/TEST-REPORT.md
          printf '\nPublished source: %s\nQA source: %s\nQA: https://github.com/%s/actions/runs/%s\nImage: %s\n' "$ACCEPTED_SHA" "$QA_SHA" "$GITHUB_REPOSITORY" "$ACCEPTED_QA" "$REF" >> release-assets/TEST-REPORT.md
          python - <<'PYLINKS'
          import os,re
          from pathlib import Path
          p=Path('release-assets/RELEASE-NOTES.md')
          prefix='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/blob/'+os.environ['TAG']+'/docs/rc13/'
          p.write_text(re.sub(r'\]\(([A-Z][A-Z0-9-]*\.md)\)',lambda m:']('+prefix+m[1]+')',p.read_text()))
          PYLINKS
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Create prerelease and verify tag, assets and unchanged privacy
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$ACCEPTED_SHA" --title "$TAG" --prerelease --latest=false --notes-file release-assets/RELEASE-NOTES.md release-assets/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/rc13-release-verified.json"
          python - <<'PY'
          import json
          r=json.load(open(__import__('os').environ['RUNNER_TEMP']+'/rc13-release-verified.json'))
          assert r['prerelease'] and not r['draft'] and r['tag_name']=='v1.0.0-rc.13'
          assert {'SHA256SUMS','IMAGE-DIGEST.txt','compose.rc13.yaml','TRUENAS-TEST.md','bibliothekar-1.0.0-rc.13-source.tar.gz'}<={a['name'] for a in r['assets']}
          print(r['html_url'])
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$ACCEPTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          test "$(gh api users/heller-adrian/packages/container/bibliothekar --jq .visibility)" = "$(python -c "import json;print(json.load(open('release-assets/registry-visibility.json'))['visibility'])")"
          mkdir "$RUNNER_TEMP/rc13-release-downloaded"
          gh release download "$TAG" --dir "$RUNNER_TEMP/rc13-release-downloaded"
          (cd "$RUNNER_TEMP/rc13-release-downloaded" && sha256sum --check SHA256SUMS)
          cat release-assets/IMAGE-DIGEST.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc13-publication-evidence
          retention-days: 30
          path: release-assets/

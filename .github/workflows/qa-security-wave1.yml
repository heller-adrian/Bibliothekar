name: Security wave 1 F14 and F12 QA
on:
  push:
    branches: [integration/1.0.0-security-wave1]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl
          python -m pip install -r requirements.txt pytest httpx
      - name: Record source and environment
        run: |
          mkdir -p "$RUNNER_TEMP/f14-qa"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/f14-qa/source.txt"
          python --version > "$RUNNER_TEMP/f14-qa/environment.txt"
          uname -a >> "$RUNNER_TEMP/f14-qa/environment.txt"
          exiftool -ver >> "$RUNNER_TEMP/f14-qa/environment.txt"
          pip freeze >> "$RUNNER_TEMP/f14-qa/environment.txt"
      - name: Entire backend suite without fail-fast
        run: python qa/f14/linux/run_linux.py "$GITHUB_WORKSPACE" backend
      - name: Original F14 reproductions on fixed source
        if: always()
        run: python qa/f14/linux/run_linux.py "$GITHUB_WORKSPACE" original-after
      - name: Original F14 reproductions on unchanged baseline
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin 35299e900b3aa38a9a45935d2a6d5fd15f75be6f
          git worktree add --detach "$RUNNER_TEMP/f14-baseline" 35299e900b3aa38a9a45935d2a6d5fd15f75be6f
          python qa/f14/linux/run_linux.py "$RUNNER_TEMP/f14-baseline" original-before
      - name: F12 unchanged original on integrated source
        if: always()
        run: python qa/wave1/run_f12.py "$GITHUB_WORKSPACE" after
      - name: F12 unchanged original on baseline
        if: always()
        run: python qa/wave1/run_f12.py "$RUNNER_TEMP/f14-baseline" before
      - name: F12 exclusive publication interleaving
        if: always()
        run: python qa/wave1/run_f12.py "$GITHUB_WORKSPACE" semantic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-wave1-qa
          retention-days: 14
          path: |
            ${{ runner.temp }}/f14-qa/**/*.json
            ${{ runner.temp }}/f14-qa/**/*.jsonl
            ${{ runner.temp }}/f14-qa/**/*.xml
            ${{ runner.temp }}/f14-qa/**/*.log
            ${{ runner.temp }}/f14-qa/**/*.txt
            ${{ runner.temp }}/wave1-f12-*

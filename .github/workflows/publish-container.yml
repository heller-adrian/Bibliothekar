name: Publish container image

on:
  push:
    branches:
      - main
      - 'patch/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bibliothekar

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate TrueNAS Custom App compose
        env:
          BIBLIOTHEKAR_CONFIG_DIR: /tmp/bibliothekar/config
          BIBLIOTHEKAR_DATABASE_DIR: /tmp/bibliothekar/database
          BIBLIOTHEKAR_LOG_DIR: /tmp/bibliothekar/logs
          BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/bibliothekar/workspace
          BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/bibliothekar/main-library
          BIBLIOTHEKAR_IMPORT_SOURCE_DIR: /tmp/bibliothekar/import-source
          BIBLIOTHEKAR_NAS_SOURCE_DIR: /tmp/bibliothekar/nas-source
          BIBLIOTHEKAR_REMOVABLE_DIR: /tmp/bibliothekar/removable
        run: docker compose -f compose.example.yaml config -q
      - name: Complete QA before publishing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest httpx
          python -m compileall -q app qa
          bash -n qa/archive_e2e/*.sh
          pytest -q -o addopts='' tests/backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published digest
        run: echo '${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

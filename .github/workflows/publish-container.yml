name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bibliothekar

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require authorized ref and new release request for patch publishing
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/heads/patch/*)
              if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
                echo 'Patch builds require explicit release-request push.' >&2
                exit 1
              fi
              if ! git diff-tree --root --no-commit-id --diff-filter=AM --name-only -r "$GITHUB_SHA" |
                  grep -Eq '^\.github/release-requests/[^/]+\.txt$'; then
                echo 'No added or modified release request in triggering commit.' >&2
                exit 1
              fi
              ;;
            *) echo "Unauthorized release ref: $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: Verify exact approved complete 1.0.0 qualification (without re-running pytest)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: '42002573062'
          QUALIFIED_SHA: 'd2a0a13e2a392b841acac83762c07939ce87242e'
          QUALIFIED_TREE: 'dda96c909c561e2702b2c28225a57d5045d3601e'
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'heller-adrian/Bibliothekar'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "${QUALIFIED_SHA}^{tree}")" = "$QUALIFIED_TREE"
          # Entire approved source tree is identical except this publisher workflow.
          # In particular the Dockerfile, every application file and both
          # dependency lock/constraint inputs are byte-identical.
          changed="$(git diff --name-only "$QUALIFIED_SHA" "$GITHUB_SHA")"
          if [[ "$changed" != '.github/workflows/publish-container.yml' ]]; then
            printf 'Rejected unqualified repository changes:\n%s\n' "$changed" >&2
            exit 1
          fi
          test "$(git rev-parse "${QUALIFIED_SHA}:app")" = "$(git rev-parse "${GITHUB_SHA}:app")"
          mkdir -p "$RUNNER_TEMP/qualified-coverage"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFIED_RUN}" > "$RUNNER_TEMP/qualified-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFIED_RUN}/jobs?per_page=100" > "$RUNNER_TEMP/qualified-jobs.json"
          gh run download "$QUALIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name 100-backend-coverage-1 --dir "$RUNNER_TEMP/qualified-coverage"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'qualified-run.json').read_text())
          jobs=json.loads((root/'qualified-jobs.json').read_text())['jobs']
          report=json.loads((root/'qualified-coverage'/'coverage-summary.json').read_text())
          sha=os.environ['QUALIFIED_SHA']
          assert run['id']==int(os.environ['QUALIFIED_RUN'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==sha
          assert run['head_branch']=='ci/1.0.0-release-full-20261105'
          assert run['path']=='.github/workflows/qa-100-stabilization.yml'
          required={'preflight','frontend','container','backend-coverage'} | {f'backend ({i})' for i in range(8)}
          assert len(jobs)==len(required) and {j['name'] for j in jobs}==required
          assert all(j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          assert report['source']==sha and report['status']=='PASS'
          assert report['collected']==2634 and report['tested_once']==2634
          parts=report['parts']
          assert len(parts)==8 and {p['partition'] for p in parts}==set(range(8))
          assert sum(p['selected'] for p in parts)==2634
          assert all(p['source']==sha and p['status']=='PASS' and p['exit']==0
                     and p['collected']==2634 and p['coverage_ok'] is True
                     and p['junit']['tests']==p['selected']
                     and all(p['junit'][field]==0 for field in ('failures','errors','skipped'))
                     for p in parts)
          print('APPROVED: 2634/2634 exact-case backend QA, container, frontend, preflight and coverage.')
          PY
          echo 'Verified source identity and successful GitHub qualification #42002573062.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate TrueNAS Custom App compose
        env:
          BIBLIOTHEKAR_APPDATA_DIR: /tmp/bibliothekar/appdata
          BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/bibliothekar/workspace
          BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/bibliothekar/main-library
          BIBLIOTHEKAR_ADMIN_PASSWORD: release-check-only-not-a-real-secret
        run: docker compose -f compose.example.yaml config -q

      - name: Install metadata regression dependency
        if: github.ref != 'refs/heads/main'
        run: sudo apt-get update -qq && sudo apt-get install -y libimage-exiftool-perl

      - name: Complete QA before publishing
        if: github.ref != 'refs/heads/main'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2
          python -m compileall -q app qa
          bash -n qa/archive_e2e/*.sh
          pytest -q -o addopts='' --junitxml=/tmp/bibliothekar-qa.xml tests/backend

      - name: Retain QA evidence
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa
          path: |
            /tmp/bibliothekar-qa.xml
            /tmp/pytest-of-*/pytest-*/0562-evidence

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          from app import __version__
          print(__version__)
          PY
          )"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige App-Version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject an existing stable version tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Stable version v${VERSION} already exists; refusing to overwrite its image or tag." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=patch-${{ steps.version.outputs.version }}-${{ github.sha }},enable=${{ startsWith(github.ref, 'refs/heads/patch/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published digest
        run: echo '${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish stable GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          cat > /tmp/release-body.md <<EOF
          Bibliothekar ${TAG}

          Container:
          - ghcr.io/${GITHUB_REPOSITORY_OWNER}/bibliothekar:latest
          - ghcr.io/${GITHUB_REPOSITORY_OWNER}/bibliothekar:${VERSION}
          - ghcr.io/${GITHUB_REPOSITORY_OWNER}/bibliothekar:${TAG}

          Digest:
          ${IMAGE_DIGEST}

          Source commit:
          ${GITHUB_SHA}
          EOF

          # Published stable releases are immutable; never rewrite an existing tag or release.
          gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/release-body.md --latest

          echo "Stable release ${TAG} points to ${GITHUB_SHA}."

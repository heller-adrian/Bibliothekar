name: Tag the qualified RC14 container
on:
  workflow_dispatch:
    inputs:
      verify_existing_adoption_image:
        description: Confirm this existing image is the qualified release candidate
        type: boolean
        default: false
        required: true
      adoption_qa_run:
        description: Run ID for the full RC14 backend evidence
        type: string
        default: ''
      qualified_digest:
        description: The exact manifest digest recorded by the successful container qualification
        required: true
        type: string
permissions: {}
concurrency:
  group: bibliothekar-rc14-release-tag
  cancel-in-progress: false
jobs:
  restart-on-zfs:
    if: github.repository == 'heller-adrian/Bibliothekar' && github.ref == 'refs/heads/codex/rc14-image-tag' && inputs.verify_existing_adoption_image && inputs.adoption_qa_run == '43770454164'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_DIGEST: ${{ inputs.qualified_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the container evidence and test process restart on a synthetic ZFS pool
        run: |
          set -euo pipefail
          source=7138797dc233770b46b381392b67dd37f40c38d5
          test "$(git rev-parse HEAD^)" = "$source"
          [[ "$QUALIFIED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          evidence="$RUNNER_TEMP/rc14-container-restart"
          mkdir "$evidence"
          gh run download 43779051964 --repo "$GITHUB_REPOSITORY" --name rc14-qualified-image --dir "$evidence"
          jq -e --arg source "$source" --arg digest "$QUALIFIED_DIGEST" '
            .source == $source and .digest == $digest and .qa_run == "43770454164" and .image_run == "43779051964" and
            .tag == "v1.0.1-rc.14" and .image == "ghcr.io/heller-adrian/bibliothekar"' "$evidence/qualified-image.json"
          bash qa/release/with_synthetic_zfs.sh bash qa/rc14-container-restart/run.sh \
            "ghcr.io/heller-adrian/bibliothekar@$QUALIFIED_DIGEST" "$source" 2>&1 | tee "$evidence/restart.log"
          grep -Fx 'RC14 native ZFS copy cleanup passed after a real container SIGKILL and restart.' "$evidence/restart.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc14-container-restart-evidence
          path: ${{ runner.temp }}/rc14-container-restart/
          if-no-files-found: error
          retention-days: 30
  tag-rc14:
    needs: restart-on-zfs
    permissions:
      packages: write
    if: github.repository == 'heller-adrian/Bibliothekar' && github.ref == 'refs/heads/codex/rc14-image-tag' && inputs.verify_existing_adoption_image && inputs.adoption_qa_run == '43770454164'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Apply the RC14 tag to the verified manifest
        env:
          QUALIFIED_DIGEST: ${{ inputs.qualified_digest }}
          REGISTRY_CREDENTIAL: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          from base64 import b64encode
          from hashlib import sha256
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          package = 'heller-adrian/bibliothekar'
          tag = 'v1.0.1-rc.14'
          qualified_tag = 'patch-1.0.1-7138797dc233770b46b381392b67dd37f40c38d5'
          digest = os.environ['QUALIFIED_DIGEST']
          registry = 'https://ghcr.io'
          media_types = ', '.join([
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.v2+json',
          ])

          def token(scope, credential=None):
              query = urlencode({'service': 'ghcr.io', 'scope': f'repository:{package}:{scope}'})
              req = Request(f'{registry}/token?{query}')
              if credential:
                  req.add_unredirected_header('Authorization', 'Basic ' + b64encode(credential.encode()).decode())
              with urlopen(req, timeout=20) as response:
                  return json.load(response)['token']

          def manifest(ref, bearer, *, data=None, media_type=None):
              req = Request(f'{registry}/v2/{package}/manifests/{ref}', data=data,
                            method='PUT' if data is not None else 'GET', headers={'Accept': media_types})
              req.add_unredirected_header('Authorization', 'Bearer ' + bearer)
              if data is not None:
                  req.add_header('Content-Type', media_type)
                  req.add_header('If-None-Match', '*')
              return urlopen(req, timeout=20)

          def pull(ref, bearer):
              with manifest(ref, bearer) as response:
                  content = response.read()
                  actual = 'sha256:' + sha256(content).hexdigest()
                  assert response.headers['Docker-Content-Digest'] == actual
                  return actual, response.headers.get_content_type(), content

          public = token('pull')
          protected = {ref: pull(ref, public)[0] for ref in ('latest', '1.0.0', 'v1.0.0')}
          actual, media_type, data = pull(digest, public)
          assert actual == digest == pull(qualified_tag, public)[0]
          try:
              current = pull(tag, public)[0]
          except HTTPError as error:
              if error.code != 404:
                  raise
              identity = os.environ['REGISTRY_ACTOR'] + ':' + os.environ['REGISTRY_CREDENTIAL']
              writer = token('pull,push', identity)
              with manifest(tag, writer, data=data, media_type=media_type) as response:
                  assert response.status == 201 and response.headers['Docker-Content-Digest'] == digest
          else:
              assert current == digest, 'The RC14 tag already refers to a different manifest'
          assert pull(tag, public)[0] == digest
          assert {ref: pull(ref, public)[0] for ref in protected} == protected
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'ghcr.io/{package}:{tag} resolves to `{digest}`.\n')
          PY

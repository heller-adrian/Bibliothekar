name: Tag the qualified RC15 container
on:
  workflow_dispatch:
    inputs:
      verify_existing_adoption_image:
        description: Confirm this existing image is the qualified release candidate
        type: boolean
        default: false
        required: true
      adoption_qa_run:
        description: Run ID for the full RC15 backend evidence
        type: string
        default: ''
permissions:
  packages: write
concurrency:
  group: bibliothekar-rc15-release-tag
  cancel-in-progress: false
jobs:
  tag-rc15:
    if: github.repository == 'heller-adrian/Bibliothekar' && github.ref == 'refs/heads/codex/rc15-image-tag' && inputs.verify_existing_adoption_image && inputs.adoption_qa_run == '43816640084'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Apply the RC15 tag to the verified manifest
        env:
          REGISTRY_CREDENTIAL: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          from base64 import b64encode
          from hashlib import sha256
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          package = 'heller-adrian/bibliothekar'
          tag = 'v1.0.1-rc.15'
          qualified_tag = 'patch-1.0.1-34df95a659f87c29a3309c660c992fd0803e1ede'
          digest = 'sha256:724fdfc4d7ca67c7875edefafb94f1ea04e8d3988cf95e7243a62e976ade7a28'
          registry = 'https://ghcr.io'
          media_types = ', '.join([
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
              'application/vnd.oci.image.manifest.v1+json',
              'application/vnd.docker.distribution.manifest.v2+json',
          ])

          def token(scope, credential=None):
              query = urlencode({'service': 'ghcr.io', 'scope': f'repository:{package}:{scope}'})
              req = Request(f'{registry}/token?{query}')
              if credential:
                  req.add_unredirected_header('Authorization', 'Basic ' + b64encode(credential.encode()).decode())
              with urlopen(req, timeout=20) as response:
                  return json.load(response)['token']

          def manifest(ref, bearer, *, data=None, media_type=None):
              req = Request(f'{registry}/v2/{package}/manifests/{ref}', data=data,
                            method='PUT' if data is not None else 'GET', headers={'Accept': media_types})
              req.add_unredirected_header('Authorization', 'Bearer ' + bearer)
              if data is not None:
                  req.add_header('Content-Type', media_type)
                  req.add_header('If-None-Match', '*')
              return urlopen(req, timeout=20)

          def pull(ref, bearer):
              with manifest(ref, bearer) as response:
                  content = response.read()
                  actual = 'sha256:' + sha256(content).hexdigest()
                  assert response.headers['Docker-Content-Digest'] == actual
                  return actual, response.headers.get_content_type(), content

          public = token('pull')
          protected = {ref: pull(ref, public)[0] for ref in ('latest', '1.0.0', 'v1.0.0', 'v1.0.1-rc.12', 'v1.0.1-rc.14')}
          actual, media_type, data = pull(digest, public)
          assert actual == digest == pull(qualified_tag, public)[0]
          try:
              current = pull(tag, public)[0]
          except HTTPError as error:
              if error.code != 404:
                  raise
              identity = os.environ['REGISTRY_ACTOR'] + ':' + os.environ['REGISTRY_CREDENTIAL']
              writer = token('pull,push', identity)
              with manifest(tag, writer, data=data, media_type=media_type) as response:
                  assert response.status == 201 and response.headers['Docker-Content-Digest'] == digest
          else:
              assert current == digest, 'The RC15 tag already refers to a different manifest'
          assert pull(tag, public)[0] == digest
          assert {ref: pull(ref, public)[0] for ref in protected} == protected
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'ghcr.io/{package}:{tag} resolves to `{digest}`.\n')
          PY

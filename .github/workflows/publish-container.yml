name: Publish container image

on:
  push:
    branches:
      - main
      - 'patch/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bibliothekar

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate TrueNAS Custom App compose
        env:
          BIBLIOTHEKAR_CONFIG_DIR: /tmp/bibliothekar/config
          BIBLIOTHEKAR_DATABASE_DIR: /tmp/bibliothekar/database
          BIBLIOTHEKAR_LOG_DIR: /tmp/bibliothekar/logs
          BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/bibliothekar/workspace
          BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/bibliothekar/main-library
          BIBLIOTHEKAR_IMPORT_SOURCE_DIR: /tmp/bibliothekar/import-source
          BIBLIOTHEKAR_NAS_SOURCE_DIR: /tmp/bibliothekar/nas-source
          BIBLIOTHEKAR_REMOVABLE_DIR: /tmp/bibliothekar/removable
        run: docker compose -f compose.example.yaml config -q
      - name: Complete QA before publishing
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt pytest httpx
          python -m compileall -q app qa
          bash -n qa/archive_e2e/*.sh
          pytest -q -o addopts='' tests/backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published digest
        run: echo '${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize existing prerelease
        if: startsWith(github.ref, 'refs/heads/patch/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#patch/}"
          TAG="v${VERSION}"

          # Ein älterer Lauf darf niemals einen neueren Patch-HEAD wieder
          # zurücktaggen. Der Branch-HEAD wird unmittelbar vor Release-/Tag-
          # Mutation erneut vom Remote gelesen.
          CURRENT_HEAD="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ -z "${CURRENT_HEAD}" ] || [ "${CURRENT_HEAD}" != "${GITHUB_SHA}" ]; then
            echo "Publish-Lauf ist veraltet: ${GITHUB_SHA}; aktueller Branch-HEAD: ${CURRENT_HEAD:-unbekannt}."
            echo "Tag und Prerelease werden nicht verändert."
            exit 0
          fi

          RELEASE_JSON=""
          if RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null)"; then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
            RELEASE_JSON=""
          fi

          if [ "${RELEASE_EXISTS}" = "true" ]; then
            printf '%s' "${RELEASE_JSON}" | jq -r '.body // ""' > /tmp/release-body.md
          else
            : > /tmp/release-body.md
          fi

          export VERSION
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("/tmp/release-body.md")
          body = path.read_text()
          digest = os.environ["IMAGE_DIGEST"]
          sha = os.environ["GITHUB_SHA"]
          version = os.environ["VERSION"]

          if not body.strip():
              body = (
                  f"Bibliothekar v{version} Prerelease.\n\n"
                  "Teststand des aktiven Patch-Branches."
              )

          body, digest_count = re.subn(
              r"(Digest:\s*\n)(?:`?sha256:[0-9a-f]+`?)",
              lambda m: m.group(1) + digest,
              body,
              count=1,
          )
          if digest_count == 0:
              body = body.rstrip() + "\n\nDigest:\n" + digest + "\n"

          body, commit_count = re.subn(
              r"(Source commit:\s*\n)(?:`?[0-9a-f]{40}`?)",
              lambda m: m.group(1) + sha,
              body,
              count=1,
          )
          if commit_count == 0:
              body = body.rstrip() + "\n\nSource commit:\n" + sha + "\n"

          path.write_text(body)
          PY

          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}" --force

          if [ "${RELEASE_EXISTS}" = "true" ]; then
            RELEASE_ID="$(printf '%s' "${RELEASE_JSON}" | jq -r '.id')"
            gh api               --method PATCH               "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"               -f target_commitish="${GITHUB_SHA}"               -F prerelease=true               --raw-field make_latest=false               --raw-field body="$(cat /tmp/release-body.md)" >/dev/null
            echo "Updated prerelease ${TAG}."
          else
            gh api               --method POST               "repos/${GITHUB_REPOSITORY}/releases"               -f tag_name="${TAG}"               -f target_commitish="${GITHUB_SHA}"               -f name="${TAG}"               -F draft=false               -F prerelease=true               --raw-field body="$(cat /tmp/release-body.md)" >/dev/null
            echo "Created prerelease ${TAG}."
          fi

          echo "Synchronized prerelease ${TAG} to ${GITHUB_SHA} with digest ${IMAGE_DIGEST}."

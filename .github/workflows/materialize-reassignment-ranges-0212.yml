name: Materialize 0.21.2 exact reassignment ranges

on:
  push:
    branches: [patch/0.21.2]
    paths:
      - tools/materialize_reassignment_ranges_0212.py
      - .github/workflows/materialize-reassignment-ranges-0212.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/0.21.2
          fetch-depth: 0
      - run: python tools/materialize_reassignment_ranges_0212.py
      - run: python -m compileall -q app
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Persist exact reassignment time segments"
            git push origin HEAD:patch/0.21.2
          fi

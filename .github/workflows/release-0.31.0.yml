name: Create Bibliothekar 0.31.0 prerelease

on:
  push:
    branches:
      - 'ops/release-0.31.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Bibliothekar 0.31.0

          Mehrbibliotheks-Release auf Basis des stabilen fachlichen Kamerakerns 0.28.7.

          Neu:
          - request-lokaler, tab-sicherer Bibliothekskontext
          - Bibliotheksumschalter und strukturierte Einstellungen
          - Bibliotheken hinzufügen, Anzeigenamen ändern, deaktivieren, reaktivieren und abmelden
          - eigene SQLite-Datenbank je zusätzlicher Bibliothek
          - globale Registry v2 mit Medien-/Familieninventar
          - bibliotheksübergreifende Reservierungen und Besitzzuordnung gegen Doppelzuordnung
          - freie Main-Familien bleiben beim Altbestands-Backfill frei
          - korrigierter direkter SD-/USB-Mount bei fehlendem /dev-Geräte-Node im Container
          - eingefrorener 0.28.7-CSS-Grundstand bleibt unverändert; neue 0.31-Komponenten separat

          Kompatibilität:
          - Main Library wird ohne Kopie oder Neuaufbau weiterverwendet
          - fachliche Ereignis-, Archiv-, Reassignment-, XMP-, Export- und Unterereignislogik bleibt auf Kern 0.28.7
          - TrueNAS bleibt eine formularbasierte Ein-Container-Custom-App

          QA:
          - 557/557 Backend-Tests PASS
          - Archiv-Isolation PASS
          - TrueNAS-Compose-Validierung PASS
          - Container Build & Push PASS

          Image:
          ghcr.io/heller-adrian/bibliothekar:patch-0.31.0

          Digest:
          sha256:b186b88218a4133ab5e23f83b0ed07ef88ae2001363ec48d5c464d1fd9fdbb3c

          Source commit:
          06ecc848918c580b2f656d9f6ad593e4123bd8a1
          EOF

          gh release create v0.31.0 \
            --repo "${{ github.repository }}" \
            --target 06ecc848918c580b2f656d9f6ad593e4123bd8a1 \
            --title "Bibliothekar 0.31.0" \
            --prerelease \
            --notes-file release-notes.md

name: Publish Bibliothekar RC9 prerelease
on:
  push:
    branches: [release/v1.0.0-rc.9]
permissions:
  contents: write
  packages: write
  actions: read
concurrency:
  group: publish-bibliothekar-rc9
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'heller-adrian/Bibliothekar'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.9
      TAG: v1.0.0-rc.9
      ACCEPTED_SHA: 5c82cac816e09d8f7cc5606215d28abc13bcdd55
      ACCEPTED_QA: '40408884111'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged accepted app and successful QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          git cat-file -e "$ACCEPTED_SHA^{commit}"
          git diff --quiet "$ACCEPTED_SHA" HEAD -- app tests qa Dockerfile compose.example.yaml requirements.txt requirements-rc.constraints.txt
          python - <<'PY'
          import os,subprocess
          changes=subprocess.check_output(['git','diff','--name-only',os.environ['ACCEPTED_SHA'],'HEAD'],text=True).splitlines()
          assert changes==['.github/workflows/publish-rc9.yml'],changes
          from app import __version__
          assert __version__=='1.0.0-rc.9',__version__
          print('Accepted application source is byte-identical.')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTED_QA" > release-assets/accepted-QA.json
          python - <<'PY'
          import json,os
          r=json.load(open('release-assets/accepted-QA.json'))
          assert r['conclusion']=='success' and r['head_sha']==os.environ['ACCEPTED_SHA']
          PY
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing release/tag; refuse overwrite.' >&2
            exit 1
          fi
          git rev-parse HEAD HEAD^{tree} > release-assets/source-identity.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing GHCR RC9 image
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'Existing registry tag; refuse overwrite.' >&2
            exit 1
          fi
      - name: Build, verify all app bytes, and smoke before publishing
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c 'from app import __version__; assert __version__ == "1.0.0-rc.9"'
          python - <<'PY'
          import os,json,hashlib,subprocess
          from pathlib import Path
          src={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('app').rglob('*') if p.is_file()}
          program='from pathlib import Path;import hashlib,json;r=Path("/opt/kamera");print(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (r/"app").rglob("*") if p.is_file()}))'
          im=json.loads(subprocess.check_output(['docker','run','--rm','--entrypoint','python',os.environ['IMAGE'],'-c',program],text=True))
          assert src==im,(len(src),len(im))
          Path('release-assets/app-sha256.json').write_text(json.dumps(im,indent=2,sort_keys=True)+'\n')
          print('Verified application bytes:',len(src))
          PY
          mkdir -p "$RUNNER_TEMP/rc9-release-smoke"
          for SCENARIO in A-archive A-roots B-missing; do
            RC7_RESET_CASE="$SCENARIO" RC7_EVIDENCE="$RUNNER_TEMP/rc9-release-smoke" python qa/rc7-reset/container.py
          done
      - name: Publish GHCR image and independently retrieve immutable digest
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee release-assets/push.log
          DIGEST="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*/\1/p' release-assets/push.log | tail -1)"
          test "${#DIGEST}" -eq 71
          REF="ghcr.io/heller-adrian/bibliothekar${DIGEST}"
          docker pull "$REF"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(docker image inspect "$REF" --format '{{.Id}}')"
          test "$(docker image inspect "$REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "$REF" -c 'from app import __version__;assert __version__=="1.0.0-rc.9"'
          printf '%s\n' "$REF" > release-assets/IMAGE-DIGEST.txt
          docker buildx imagetools inspect "$REF" --raw > release-assets/registry-manifest.json
      - name: Package source and verified TrueNAS update guidance
        shell: bash
        run: |
          set -euo pipefail
          REF="$(cat release-assets/IMAGE-DIGEST.txt)"
          cp compose.example.yaml release-assets/compose.rc9.yaml
          sed -i "s|ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.9|$REF|" release-assets/compose.rc9.yaml
          cat > release-assets/UPDATE-RC8-RC9.md <<'EOF'
          # RC8 to RC9: TrueNAS prerelease test upgrade

          Stop Bibliothekar and make a consistent backup including the databases
          and SQLite WAL/SHM, /config, /logs, /workspace and all retained recovery
          evidence. Do not perform Clean Slate or remove/rename mounted folders.

          Change only the image reference to the verified registry digest in
          IMAGE-DIGEST.txt. Keep host paths, ACLs, environment and secrets unchanged.
          The earlier RC8 image remains available for rollback.

          RC9 permits initial setup with a populated but unregistered external
          archive. It never deletes or automatically adopts preexisting archive
          photos. Existing registered libraries, unknown data and unfinished jobs
          continue to block unsafe resets. For damaged used libraries, restore
          original NAS paths rather than replacing them with new empty folders.

          Native TrueNAS/ZFS/NFSv4 and removable-device setup remain to be tested.
          EOF
          cat > release-assets/RELEASE-NOTES.md <<'EOF'
          # Bibliothekar v1.0.0-rc.9 prerelease

          Variant B: independent first-library setup and protected existing-library
          recovery boundaries. A populated, unregistered mounted archive no longer
          blocks the initial setup. Files remain untouched and are not silently
          registered. Explicit setup handles stale F14 managed-folder bindings;
          uncertain existing installations remain blocked. A setup/recovery help
          entry remains visible even if automatic reset is forbidden.

          Linux targeted regression suite, reproducible amd64 container, six
          isolated QA scenarios, real library creation, restart, preservation of
          existing archive bytes and damaged-installation refusal passed.

          RC9 is a prerelease, not the final stable 1.0.0. Native TrueNAS
          validation and terminal-free SD-card permission onboarding are still open.
          No new complete backend-wide test suite has been run for RC9.
          EOF
          cp Dockerfile requirements.txt requirements-rc.constraints.txt release-assets/
          git archive --format=tar --prefix=bibliothekar-1.0.0-rc.9/ HEAD | gzip -n > release-assets/bibliothekar-1.0.0-rc.9-source.tar.gz
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Create GitHub prerelease, verify assets, tag and digest
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/RELEASE-NOTES.md > "$RUNNER_TEMP/rc9-notes.md"
          printf '\nCommit: %s\nTree: %s\nImage: %s\nQA: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$(cat release-assets/IMAGE-DIGEST.txt)" "$GITHUB_REPOSITORY" "$ACCEPTED_QA" >> "$RUNNER_TEMP/rc9-notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --prerelease --latest=false \
            --notes-file "$RUNNER_TEMP/rc9-notes.md" release-assets/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release-assets/release-verification.json
          python - <<'PY'
          import json
          x=json.load(open('release-assets/release-verification.json'))
          assert x['prerelease'] and not x['draft'] and x['tag_name']=='v1.0.0-rc.9'
          names={a['name'] for a in x['assets']}
          assert {'SHA256SUMS','IMAGE-DIGEST.txt','compose.rc9.yaml','UPDATE-RC8-RC9.md'}<=names,names
          print(x['html_url'])
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Upload non-binary release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc9-release-evidence
          retention-days: 30
          path: |
            release-assets/
            !release-assets/*.tar.gz
            ${{ runner.temp }}/rc9-release-smoke/

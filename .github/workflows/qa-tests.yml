name: RC14 native TrueNAS NFSv4 qualification
on:
  workflow_dispatch:
    inputs:
      full_backend:
        description: Leave unchecked for the native TrueNAS test
        default: false
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  native-truenas:
    if: github.repository == 'heller-adrian/Bibliothekar' && github.ref == 'refs/heads/codex/rc14-native-nfsv4' && !inputs.full_backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUALIFIED_SOURCE: 7138797dc233770b46b381392b67dd37f40c38d5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SOURCE }}
          persist-credentials: false
          path: product
      - name: Boot the TrueNAS kernel and run the lifecycle as uid 568
        run: bash lab/qa/rc13-native-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc14-native-truenas-evidence
          path: |
            ${{ runner.temp }}/rc13-native-evidence/
          if-no-files-found: error
          retention-days: 30

name: Backend QA
on:
  # Documentation and housekeeping commits do not need the long regression suite.
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'qa/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'compose*.yaml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'qa/**'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'compose*.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bibliothekar-main-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTEST_ADDOPTS: ''
      BIBLIOTHEKAR_APPDATA_DIR: /tmp/bibliothekar-qa/appdata
      BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/bibliothekar-qa/workspace
      BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/bibliothekar-qa/main-library
      BIBLIOTHEKAR_ADMIN_PASSWORD: ci-synthetic-never-use-this-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install external test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl
          exiftool -ver
          git --version
      - name: Install test-only dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2
      - name: Check Compose template without privileged host access
        run: docker compose -f compose.example.yaml config -q
      - name: Compile backend and QA helpers
        run: python -m compileall -q app qa
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n qa/archive_e2e/*.sh
          python - <<'PY'
          from pathlib import Path
          from app.events_ui import EVENTS_HTML
          from app.ui_shell import BIBLIOTHEKAR_JS
          import re
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',EVENTS_HTML,flags=re.S)
          assert scripts
          Path("/tmp/bibliothekar-events.js").write_text("\n".join(scripts))
          Path("/tmp/bibliothekar-shell.js").write_text(BIBLIOTHEKAR_JS)
          PY
          node --check /tmp/bibliothekar-shell.js
          node --check /tmp/bibliothekar-events.js
      # Public pull requests must never execute their code on a self-hosted runner.
      - name: Full backend regression tests (synthetic fixtures only)
        run: pytest -q -o addopts='' --junitxml=/tmp/bibliothekar-main-qa.xml tests/backend
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa
          path: /tmp/bibliothekar-main-qa.xml

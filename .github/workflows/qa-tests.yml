name: Backend QA

# 0.45.2: Entwicklungspushes lösen keine GitHub-Minuten mehr aus.
# QA bei PR oder manuell über "Run workflow" am jeweiligen Branch starten.
on:
  workflow_dispatch:
  push:
    branches:
      - patch/0.56.1
    paths-ignore:
      - '.github/release-requests/**'
  pull_request:

permissions:
  contents: read

# Ein Patchlauf ersetzt den vorherigen Lauf desselben Branches.
concurrency:
  group: backend-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTEST_ADDOPTS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl
          pip install -r requirements.txt pytest httpx
      - name: Validate TrueNAS Custom App compose
        env:
          BIBLIOTHEKAR_CONFIG_DIR: /tmp/bibliothekar/config
          BIBLIOTHEKAR_DATABASE_DIR: /tmp/bibliothekar/database
          BIBLIOTHEKAR_LOG_DIR: /tmp/bibliothekar/logs
          BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/bibliothekar/workspace
          BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/bibliothekar/main-library
          BIBLIOTHEKAR_IMPORT_SOURCE_DIR: /tmp/bibliothekar/import-source
          BIBLIOTHEKAR_NAS_SOURCE_DIR: /tmp/bibliothekar/nas-source
          BIBLIOTHEKAR_REMOVABLE_DIR: /tmp/bibliothekar/removable
        run: docker compose -f compose.example.yaml config -q
      - name: Compile application and QA helpers
        run: python -m compileall -q app qa
      - name: Validate archive QA shell syntax
        run: bash -n qa/archive_e2e/*.sh
      - name: Collect complete backend regression suite
        run: pytest --collect-only -q -o addopts='' tests/backend
      - name: Run complete backend regression suite without fail-fast
        run: pytest -q -o addopts='' tests/backend

  archive-isolation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive QA shell syntax
        run: bash -n qa/archive_e2e/*.sh
      - name: Build image from exactly this commit
        run: docker build --build-arg SOURCE_REVISION="${GITHUB_SHA}" -t "bibliothekar-ci:${GITHUB_SHA}" .
      - name: Exercise isolated archive QA harness
        env:
          QA_IMAGE: bibliothekar-ci:${{ github.sha }}
          QA_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          CI_SOURCE=/mnt/storage/backup/kamera-sd-karten/CI_DUMMY
          sudo mkdir -p "$CI_SOURCE"
          sudo chown -R "$(id -u):$(id -g)" /mnt/storage/backup/kamera-sd-karten
          printf 'Bibliothekar archive QA harness smoke test\n' > "$CI_SOURCE/real-copy-placeholder.bin"

          export QA_ROOT="$RUNNER_TEMP/bibliothekar-archive-qa"
          export QA_RUN_ID="ci_archive_harness"
          export QA_PORT=31044
          trap 'QA_ROOT="$QA_ROOT" bash qa/archive_e2e/stop_isolated_archive_qa.sh >/dev/null 2>&1 || true' EXIT

          bash qa/archive_e2e/start_isolated_archive_qa.sh "$CI_SOURCE"

          test -f "$QA_ROOT/runs/$QA_RUN_ID/database/kamera.sqlite3"
          python3 - "$QA_ROOT/runs/$QA_RUN_ID/isolation.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text())
          assert data['status'] == 'PASS'
          assert data['product_revision'] == os.environ['GITHUB_SHA']
          assert data['production_archive_mounted'] is False
          assert data['production_database_mounted'] is False
          run_root = data['workspace'].rsplit('/workspace', 1)[0]
          assert data['database'].startswith(run_root + '/')
          assert data['archive_root'].endswith('/archive-test-library')
          PY

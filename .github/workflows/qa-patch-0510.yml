name: QA patch 0.51.0 (no publishing)
on:
  push:
    branches:
      - patch/0.51.0
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-patch-0510-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python
        run: python -m compileall -q app tests/backend
      - name: Full isolated backend suite
        run: pytest -q -o addopts='' tests/backend

name: Pre6 targeted TrueNAS acceptance corrections
on:
  push:
    branches: [codex/pre6-truenas-acceptance]
    paths-ignore: ['docs/**', 'FORTSETZUNG.md']
permissions:
  contents: read
  actions: read
concurrency:
  group: bibliothekar-pre6-targeted
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: pre6-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pre6-${{ github.run_id }}
      - name: Isolated runtime and targeted original positive and negative contracts
        run: |
          set -euo pipefail
          WORK="$(mktemp -d /tmp/bibliothekar-pre6.XXXXXXXX)"
          printf 'WORK=%s\n' "$WORK" >> "$GITHUB_ENV"
          export WORK
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2==1.4.0
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" "$WORK/venv/bin/python" qa/pre6/reuse_backend.py 2>&1 | tee "$WORK/targeted.log"
      - name: Actual UI functions in offline Chromium German English and mobile desktop
        run: |
          set -euo pipefail
          export KAMERA_CONFIG="$WORK/settings.json" KAMERA_WORKSPACE="$WORK/workspace" KAMERA_DATABASE_DIR="$WORK/database" KAMERA_REGISTRY_DATABASE="$WORK/registry.sqlite3" PYTHONPATH="$PWD"
          "$WORK/venv/bin/python" qa/pre6/export_ui.py "$WORK/ui.json"
          npm install --prefix "$WORK/browser-tools" playwright@1.62.1
          mkdir "$WORK/browser"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m,mode=1777 \
            -v "$PWD/qa:/qa:ro" -v "$WORK:/evidence" \
            -e NODE_PATH=/evidence/browser-tools/node_modules -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            node /qa/pre6/browser.cjs /evidence/ui.json /evidence/browser 2>&1 | tee "$WORK/browser.log"
      - name: Unpublished image and existing real supervisor correction admission restart and fences
        run: |
          set -euo pipefail
          IMAGE="bibliothekar-pre6-qa:${GITHUB_RUN_ID}"
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" . 2>&1 | tee "$WORK/build.log"
          IMAGE="$IMAGE" RUNNER_TEMP="$WORK" python3 qa/pre5/container.py 2>&1 | tee "$WORK/container.log"
      - name: Preserve exact source and complete targeted evidence
        if: always() && env.WORK != ''
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['WORK'])
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file() and (p.suffix in {'.log','.xml','.json','.png'})
                 and not any(n in p.parts for n in ('venv','browser-tools','scratch','archive','workspace','appdata','second','nas'))}
          (root/'EVIDENCE.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.WORK != ''
        with:
          name: pre6-targeted-evidence
          retention-days: 30
          path: |
            ${{ env.WORK }}/EVIDENCE.json
            ${{ env.WORK }}/*.log
            ${{ env.WORK }}/f14-qa/targets/results/
            ${{ env.WORK }}/browser/
            ${{ env.WORK }}/BACKEND-EVIDENCE.json
            ${{ env.WORK }}/accepted-backend.zip
            ${{ env.WORK }}/accepted-backend/f14-qa/targets/results/
            ${{ env.WORK }}/pre5-live.json
            ${{ env.WORK }}/pre5-live.log
            ${{ env.WORK }}/pre5-browser/

name: RC13 isolated container acceptance
'on':
  push:
    branches:
    - release/v1.0.0-rc.13
    paths:
    - qa/rc13/container.py
    - .github/workflows/qa-rc13-container.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: rc13-container
  cancel-in-progress: true
jobs:
  acceptance:
    name: Real supervisor RC12 upgrade and crash acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      IMAGE: bibliothekar:rc13-acceptance
      RC12_IMAGE: bibliothekar:rc12-original
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Require accepted full backend and unchanged application
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git diff --quiet fa803ca7e2435f69c6a226e46bccfab528712571 "$GITHUB_SHA" -- app tests qa Dockerfile compose.example.yaml compose.removable.yaml compose.nas-source.yaml requirements.txt requirements-rc.constraints.txt ':(exclude)qa/rc13/container.py'
        gh api repos/heller-adrian/Bibliothekar/actions/runs/40661973452 > "$RUNNER_TEMP/backend-run.json"
        gh api repos/heller-adrian/Bibliothekar/actions/runs/40661973452/jobs > "$RUNNER_TEMP/backend-jobs.json"
        python - <<'PYGATE'
        import json,os
        from pathlib import Path
        p=Path(os.environ['RUNNER_TEMP'])
        r=json.loads((p/'backend-run.json').read_text())
        assert r['head_sha']=='fa803ca7e2435f69c6a226e46bccfab528712571' and r['status']=='completed'
        assert r['path']=='.github/workflows/qa-rc13.yml'
        jobs=json.loads((p/'backend-jobs.json').read_text())['jobs']
        required={'Targeted failure and security gate','Chromium German English mobile desktop'}|{'Complete backend ('+str(i)+')' for i in range(8)}
        assert len([j for j in jobs if j['name'] in required])==10
        assert all(next(j for j in jobs if j['name']==name)['conclusion']=='success' for name in required)
        print('Full backend and browser accepted; application/tests unchanged.')
        PYGATE
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: sudo apt-get update -qq && sudo apt-get install -y acl
    - name: Compose contract
      env:
        BIBLIOTHEKAR_APPDATA_DIR: /tmp/rc13/appdata
        BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/rc13/workspace
        BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/rc13/archive
        BIBLIOTHEKAR_NAS_SOURCE_DIR: /tmp/rc13/source
        BIBLIOTHEKAR_ADMIN_PASSWORD: isolated-rc13-compose-password
      run: docker compose -f compose.example.yaml -f compose.removable.yaml -f compose.nas-source.yaml config -q
    - name: Build exact candidate and original released RC12
      run: |
        docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "$IMAGE" .
        mkdir "$RUNNER_TEMP/rc12-source"
        git archive 671d7e7eb96ff493ae51720bb2769eccd8f9048f | tar -x -C "$RUNNER_TEMP/rc12-source"
        docker build --platform linux/amd64 --build-arg SOURCE_REVISION=671d7e7eb96ff493ae51720bb2769eccd8f9048f -t "$RC12_IMAGE" "$RUNNER_TEMP/rc12-source"
    - name: Real RC12 deletion and blocked restart to RC13, UID568, HTTP, second library, SIGKILL
      run: python qa/rc13/container.py
    - name: Preserve all RC12 storage repair and bootstrap acceptance
      run: python qa/rc12/container.py
    - name: Preserve RC10 RC11 migration and crash acceptance
      run: python qa/rc11/container.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rc13-container
        path: |
          ${{ runner.temp }}/rc13-evidence.json
          ${{ runner.temp }}/rc13-container-logs
          ${{ runner.temp }}/rc12-evidence.json
          ${{ runner.temp }}/rc12-container-logs
          ${{ runner.temp }}/rc11-evidence.json
          ${{ runner.temp }}/rc11-container-logs

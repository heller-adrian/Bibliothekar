name: pre5 targeted operation recovery
on:
  push:
    branches: [codex/pre5-operation-recovery]
    paths-ignore: ['docs/**', 'FORTSETZUNG.md']
permissions:
  contents: read
  packages: read
concurrency:
  group: pre5-operation-recovery
  cancel-in-progress: false
jobs:
  reproductions:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
        working-directory: pre5-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pre5-${{ github.run_id }}
      - name: Isolated Linux runtime
        run: |
          set -euo pipefail
          QA_WORK="$(mktemp -d /tmp/bibliothekar-pre5.XXXXXXXX)"
          printf 'QA_WORK=%s\n' "$QA_WORK" >> "$GITHUB_ENV"
          python3 -m venv "$QA_WORK/venv"
          "$QA_WORK/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2==1.4.0
      - name: Diagnose 24 representative cases from 12 unresolved groups with complete XML and stdout
        if: contains(github.event.head_commit.message, '[pre5-diag]')
        run: |
          set -euo pipefail
          "$QA_WORK/venv/bin/python" qa/pre5/diagnose_remaining.py
      - name: Full BA-02 deletion and original F14 negative recovery regression file
        if: contains(github.event.head_commit.message, '[pre5-backup]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/backup-contracts"
          set +e
          RUNNER_TEMP="$QA_WORK/backup-contracts" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_backup_contracts.json 2>&1 | tee "$QA_WORK/backup-contracts.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/backup-contracts/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/backup-contracts/f14-qa/targets/results/result.xml" "$QA_WORK/backup-contracts.xml"; fi
          exit "$RESULT"
      - name: Diagnose qualified import crash and preserve each restart log
        if: contains(github.event.head_commit.message, '[pre5-import]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/import-diagnostic"
          set +e
          RUNNER_TEMP="$QA_WORK/import-diagnostic" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_import_only.json 2>&1 | tee "$QA_WORK/import-diagnostic.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/import-diagnostic/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/import-diagnostic/f14-qa/targets/results/result.xml" "$QA_WORK/import-diagnostic.xml"; fi
          exit "$RESULT"
      - name: Isolated recovery contracts for backup restore and SD recheck
        if: contains(github.event.head_commit.message, '[pre5-recovery]') || contains(github.event.head_commit.message, '[pre5-full]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/recovery-contracts"
          set +e
          RUNNER_TEMP="$QA_WORK/recovery-contracts" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_recovery_contracts.json 2>&1 | tee "$QA_WORK/recovery-contracts.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/recovery-contracts/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/recovery-contracts/f14-qa/targets/results/result.xml" "$QA_WORK/recovery-contracts.xml"; fi
          if test "$RESULT" -ne 0; then exit "$RESULT"; fi
          PYTHONPATH="$PWD" "$QA_WORK/venv/bin/python" -m pytest -q tests/backend/test_pre_metadata_retry.py --junitxml="$QA_WORK/rc14-legacy-key.xml"
      - name: Verify two concurrent read-only event inspection contracts
        if: contains(github.event.head_commit.message, '[pre5-read-contracts]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/read-contracts"
          set +e
          RUNNER_TEMP="$QA_WORK/read-contracts" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_read_contracts.json 2>&1 | tee "$QA_WORK/read-contracts.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/read-contracts/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/read-contracts/f14-qa/targets/results/result.xml" "$QA_WORK/read-contracts.xml"; fi
          exit "$RESULT"
      - name: Verify three repaired fixture and historical expectation contracts
        if: contains(github.event.head_commit.message, '[pre5-fixture]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/fixture"
          set +e
          RUNNER_TEMP="$QA_WORK/fixture" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_fixture.json 2>&1 | tee "$QA_WORK/backend-fixture.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/fixture/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/fixture/f14-qa/targets/results/result.xml" "$QA_WORK/backend-fixture.xml"; fi
          exit "$RESULT"
      - name: Recheck seven complete-backend metadata crash and secondary-library nodes
        if: contains(github.event.head_commit.message, '[pre5-full-seven]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/full-seven"
          set +e
          RUNNER_TEMP="$QA_WORK/full-seven" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_full_seven_20261102.json 2>&1 | tee "$QA_WORK/full-seven.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/full-seven/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/full-seven/f14-qa/targets/results/result.xml" "$QA_WORK/full-seven.xml"; fi
          exit "$RESULT"
      - name: Reproduce all nineteen previously failed backend nodes before full suites
        if: contains(github.event.head_commit.message, '[pre5-full]') || contains(github.event.head_commit.message, '[pre5-19]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/backend-nineteen"
          set +e
          RUNNER_TEMP="$QA_WORK/backend-nineteen" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_19_previous_failures.json 2>&1 | tee "$QA_WORK/backend-19.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/backend-nineteen/f14-qa/targets/results/result.xml"; then
            cp "$QA_WORK/backend-nineteen/f14-qa/targets/results/result.xml" "$QA_WORK/backend-19.xml"
          fi
          exit "$RESULT"
      - name: Recheck seven original historical metadata and SIGKILL failures
        if: contains(github.event.head_commit.message, '[pre5-7]') || contains(github.event.head_commit.message, '[pre5-full]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/historical-seven"
          set +e
          RUNNER_TEMP="$QA_WORK/historical-seven" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_remaining_7.json 2>&1 | tee "$QA_WORK/backend-seven.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/historical-seven/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/historical-seven/f14-qa/targets/results/result.xml" "$QA_WORK/backend-seven.xml"; fi
          exit "$RESULT"
      - name: Reproduce eight remaining full-backend contract failures
        if: contains(github.event.head_commit.message, '[pre5-backend-cases]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/backend-new-eight"
          set +e
          RUNNER_TEMP="$QA_WORK/backend-new-eight" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_full_new_failures.json 2>&1 | tee "$QA_WORK/backend-new-eight.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/backend-new-eight/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/backend-new-eight/f14-qa/targets/results/result.xml" "$QA_WORK/backend-new-eight.xml"; fi
          exit "$RESULT"
      - name: Check all 147 original backend failures not covered by previous focused evidence
        if: contains(github.event.head_commit.message, '[pre5-full]')
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/original-unretested"
          RUNNER_TEMP="$QA_WORK/original-unretested" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets qa/pre5/backend_unretested.json 2>&1 | tee "$QA_WORK/backend-unretested.log"
          cp "$QA_WORK/original-unretested/f14-qa/targets/results/result.xml" "$QA_WORK/backend-unretested.xml"
      - name: Focused SQLite authorization and historical bootstrap qualification
        if: contains(github.event.head_commit.message, '[pre5-db-auth]') || contains(github.event.head_commit.message, '[pre5-profile]') || contains(github.event.head_commit.message, '[pre5-closure]') || contains(github.event.head_commit.message, '[pre5-contracts]')
        env:
          PROFILE_SLOW_CASES: ${{ contains(github.event.head_commit.message, '[pre5-profile]') }}
          CLOSURE_FOCUS: ${{ contains(github.event.head_commit.message, '[pre5-closure]') }}
          CONTRACT_FOCUS: ${{ contains(github.event.head_commit.message, '[pre5-contracts]') }}
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/authorization"
          cp qa/pre5/backend_focus.json "$QA_WORK/backend-focus-targets.json"
          if test "$CLOSURE_FOCUS" = true; then cp qa/pre5/backend_closure.json "$QA_WORK/backend-focus-targets.json"; fi
          if test "$CONTRACT_FOCUS" = true; then cp qa/pre5/backend_contracts.json "$QA_WORK/backend-focus-targets.json"; fi
          if test "$PROFILE_SLOW_CASES" = true; then
            printf '%s\n' '["tests/backend/test_rc14_import.py::test_rc13_staged_zero_published_resume_preserves_origin[3892]", "tests/backend/test_rc5_practice_followup.py::test_hundred_known_files_no_import_and_no_managed_folders"]' > "$QA_WORK/backend-focus-targets.json"
            export AUDIT_PROFILE_MATCH='test_rc13_staged_zero_published_resume_preserves_origin|test_hundred_known_files_no_import_and_no_managed_folders'
          fi
          set +e
          RUNNER_TEMP="$QA_WORK/authorization" "$QA_WORK/venv/bin/python" qa/f14/linux/run_linux.py "$PWD" targets "$QA_WORK/backend-focus-targets.json" 2>&1 | tee "$QA_WORK/backend-focus.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if test -f "$QA_WORK/authorization/f14-qa/targets/results/result.xml"; then cp "$QA_WORK/authorization/f14-qa/targets/results/result.xml" "$QA_WORK/backend-focus.xml"; fi
          exit "$RESULT"
      - name: Isolated Linux reproductions
        if: ${{ !contains(github.event.head_commit.message, '[pre5-profile]') && !contains(github.event.head_commit.message, '[pre5-contracts]') && !contains(github.event.head_commit.message, '[pre5-diag]') && !contains(github.event.head_commit.message, '[pre5-fixture]') && !contains(github.event.head_commit.message, '[pre5-read-contracts]') && !contains(github.event.head_commit.message, '[pre5-recovery]') && !contains(github.event.head_commit.message, '[pre5-import]') && !contains(github.event.head_commit.message, '[pre5-backup]') }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" "$QA_WORK/venv/bin/python" -m pytest -v tests/backend/test_pre5_operation_recovery.py --tb=long --junitxml="$QA_WORK/pre5.xml" 2>&1 | tee "$QA_WORK/pre5.log"
      - name: Focused provenance and inventory failures
        if: ${{ !contains(github.event.head_commit.message, '[pre5-profile]') && !contains(github.event.head_commit.message, '[pre5-contracts]') && !contains(github.event.head_commit.message, '[pre5-diag]') && !contains(github.event.head_commit.message, '[pre5-fixture]') && !contains(github.event.head_commit.message, '[pre5-read-contracts]') && !contains(github.event.head_commit.message, '[pre5-recovery]') && !contains(github.event.head_commit.message, '[pre5-import]') && !contains(github.event.head_commit.message, '[pre5-backup]') }}
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" "$QA_WORK/venv/bin/python" -m pytest -q --junitxml="$QA_WORK/focused.xml" \
            tests/backend/test_rc13_provenance.py \
            tests/backend/test_rc14_import.py::test_reconcile_hash_does_not_hold_catalogue_writer \
            tests/backend/test_0411_physical_truth.py tests/backend/test_0412_consistency_semantics.py \
            tests/backend/test_0501_external_event_deletion.py tests/backend/test_0440_trash.py \
            tests/backend/test_0311_global_stock.py tests/backend/test_0328_patch.py \
            tests/backend/test_f16_f20_stock_consistency.py \
            tests/backend/test_pre_metadata.py::test_general_admission_reuses_durable_job_for_same_bytes \
            tests/backend/test_pre2_metadata_abort.py::test_uncertain_startup_only_releases_scoped_workers \
            2>&1 | tee "$QA_WORK/focused.log"
      - name: Structural, historical metadata and F14 regressions
        if: contains(github.event.head_commit.message, '[pre5-historical]')
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" "$QA_WORK/venv/bin/python" -m pytest -q --junitxml="$QA_WORK/historical.xml" \
            tests/backend/test_pre4_operation_separation.py \
            tests/backend/test_pre2_metadata_abort.py tests/backend/test_pre3_metadata_transfer.py \
            tests/backend/test_pre_metadata.py tests/backend/test_pre_metadata_retry.py \
            tests/backend/test_pre_startup_performance.py tests/backend/test_rc12_storage.py \
            tests/backend/test_f14_root_operations.py tests/backend/test_f14_admission.py \
            tests/backend/test_rc13_provenance.py tests/backend/test_rc14_import.py \
            tests/backend/test_0411_physical_truth.py tests/backend/test_0412_consistency_semantics.py \
            tests/backend/test_0501_external_event_deletion.py 2>&1 | tee "$QA_WORK/historical.log"
      - name: Preserve evidence
        if: always() && env.QA_WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre5-reproductions-${{ github.run_attempt }}
          path: |
            ${{ env.QA_WORK }}/*.xml
            ${{ env.QA_WORK }}/*.log
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/results/
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/process.log
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/restart*.log
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/result.json
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/execution.json
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/f14-proof.json
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/checkpoint.json
            ${{ env.QA_WORK }}/authorization/f14-qa/targets/scratch/pytest/**/stdout.log
            ${{ env.QA_WORK }}/diagnostics-evidence/
            ${{ env.QA_WORK }}/fixture/f14-qa/targets/results/
            ${{ env.QA_WORK }}/read-contracts/f14-qa/targets/results/
            ${{ env.QA_WORK }}/recovery-contracts/f14-qa/targets/results/
            ${{ env.QA_WORK }}/original-unretested/f14-qa/targets/results/
            ${{ env.QA_WORK }}/import-diagnostic/f14-qa/targets/results/
            ${{ env.QA_WORK }}/import-diagnostic/f14-qa/targets/scratch/pytest/**/process.log
            ${{ env.QA_WORK }}/import-diagnostic/f14-qa/targets/scratch/pytest/**/result.json
            ${{ env.QA_WORK }}/import-diagnostic/f14-qa/targets/scratch/pytest/**/execution.json
            ${{ env.QA_WORK }}/recovery-contracts/f14-qa/targets/scratch/pytest/**/process.log
            ${{ env.QA_WORK }}/recovery-contracts/f14-qa/targets/scratch/pytest/**/restart*.log
            ${{ env.QA_WORK }}/recovery-contracts/f14-qa/targets/scratch/pytest/**/result.json
            ${{ env.QA_WORK }}/recovery-contracts/f14-qa/targets/scratch/pytest/**/execution.json
            ${{ env.QA_WORK }}/backup-contracts/f14-qa/targets/results/
          retention-days: 30

  container:
    needs: reproductions
    if: contains(github.event.head_commit.message, '[pre5-container]') || contains(github.event.head_commit.message, '[pre5-full]') || contains(github.event.head_commit.message, '[pre5-iphone]')
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: pre5-container-${{ github.run_id }}
    env:
      PRE4_IMAGE: ghcr.io/heller-adrian/bibliothekar@sha256:0678dca61f426a01ae724852741bcad6fd7cf45ae3c13df873ed6f14349c4d77
      PRE2_IMAGE: ghcr.io/heller-adrian/bibliothekar@sha256:b9434137951a8f1e40de047bed6e3d8ee3be425e079b92aa6df9ec491c982c13
      PRE1_IMAGE: ghcr.io/heller-adrian/bibliothekar@sha256:cbaa863fb6173736bcd43e917de994fadba3d05cc69c1688c618fad21d8a17b8
      RC14_IMAGE: ghcr.io/heller-adrian/bibliothekar@sha256:86991ef46f1f29a990b63ea3983b1193adfe378247d1202e41fdfd7e21d44b9b
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/pre5-container-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pre5-container-${{ github.run_id }}
      - name: Isolated container scratch directory
        run: |
          set -euo pipefail
          QA_WORK="$(mktemp -d "$RUNNER_TEMP/bibliothekar-pre5-container.XXXXXXXX")"
          printf 'QA_WORK=%s\n' "$QA_WORK" >> "$GITHUB_ENV"
      - name: Build one isolated candidate and pull immutable historical fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir "$QA_WORK/docker"
          export DOCKER_CONFIG="$QA_WORK/docker"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="bibliothekar-pre5-qa:$GITHUB_RUN_ID"
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "$IMAGE" .
          printf 'IMAGE=%s\n' "$IMAGE" >> "$GITHUB_ENV"
          docker pull "$PRE4_IMAGE"
          docker pull "$PRE2_IMAGE"
          docker pull "$PRE1_IMAGE"
          docker pull "$RC14_IMAGE"
          docker image inspect "$IMAGE" > "$QA_WORK/candidate-image.json"
      - name: Isolated Chromium tooling
        if: ${{ !contains(github.event.head_commit.message, '[pre5-iphone]') }}
        run: |
          set -euo pipefail
          npm install --prefix "$QA_WORK/browser-tools" playwright@1.62.1
          printf 'NODE_PATH=%s/browser-tools/node_modules\n' "$QA_WORK" >> "$GITHUB_ENV"
      - name: Real API, supervisor, web termination, container restart and protected reads
        if: ${{ !contains(github.event.head_commit.message, '[pre5-iphone]') }}
        run: |
          set -euo pipefail
          RUNNER_TEMP="$QA_WORK" python3 qa/pre5/container.py 2>&1 | tee "$QA_WORK/container.log"
          RUNNER_TEMP="$QA_WORK" python3 qa/pre4/container.py 2>&1 | tee "$QA_WORK/pre4-container.log"
          RUNNER_TEMP="$QA_WORK" python3 qa/pre4/historical_container.py 2>&1 | tee "$QA_WORK/historical-container.log"
      - name: Ninety media files, real events, archive copy and three external moves
        if: ${{ !contains(github.event.head_commit.message, '[pre5-iphone]') }}
        run: |
          set -euo pipefail
          RUNNER_TEMP="$QA_WORK" python3 qa/pre5/manual_changes_container.py 2>&1 | tee "$QA_WORK/manual-changes.log"
      - name: Four thousand families and fourteen iPhone JPEGs
        if: ${{ !contains(github.event.head_commit.message, '[pre5-iphone]') }}
        run: |
          set -euo pipefail
          RUNNER_TEMP="$QA_WORK" python3 qa/pre/startup_container.py 2>&1 | tee "$QA_WORK/startup.log"
          RUNNER_TEMP="$QA_WORK" python3 qa/pre/container.py 2>&1 | tee "$QA_WORK/iphone.log"
      - name: Reproduce immutable RC14 fourteen-JPEG upgrade only
        if: contains(github.event.head_commit.message, '[pre5-iphone]')
        run: |
          set -euo pipefail
          RUNNER_TEMP="$QA_WORK" python3 qa/pre/container.py 2>&1 | tee "$QA_WORK/iphone.log"
      - name: Preserve evidence
        if: always() && env.QA_WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre5-container-${{ github.run_attempt }}
          path: |
            ${{ env.QA_WORK }}/*.json
            ${{ env.QA_WORK }}/*.log
            ${{ env.QA_WORK }}/pre5-browser/*
            ${{ env.QA_WORK }}/pre4-historical/*.log
            ${{ env.QA_WORK }}/pre4-browser/*
          retention-days: 30
      - name: Remove only this run's temporary registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: rm -f "$DOCKER_CONFIG/config.json"

  backend:
    # Backend evidence must remain observable even when an independent container
    # migration contract fails. The overall workflow stays red on any failure.
    needs: reproductions
    if: contains(github.event.head_commit.message, '[pre5-full]') || contains(github.event.head_commit.message, '[pre5-backend]')
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    # Eight isolated partitions take >150 minutes on the real safe runner.
    # Let the final partition finish rather than cancel valid node coverage.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
        working-directory: pre5-full-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pre5-full-${{ github.run_id }}
      - name: Isolated runtime and all disjoint backend partitions
        run: |
          set -euo pipefail
          # Legacy private-authority tests deliberately audit every ancestor.
          # The shared runner checkout parent is group-writable. Use an owned
          # disposable subtree under sticky /tmp; never chmod runner parents.
          QA_WORK="$(mktemp -d /tmp/bibliothekar-pre5-full.XXXXXXXX)"
          printf 'QA_WORK=%s\n' "$QA_WORK" >> "$GITHUB_ENV"
          python3 -m venv "$QA_WORK/venv"
          "$QA_WORK/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2==1.4.0
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" RUNNER_TEMP="$QA_WORK" "$QA_WORK/venv/bin/python" qa/pre5/full_backend.py
      - name: Preserve complete node coverage and all test evidence
        if: always() && env.QA_WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre5-full-backend-${{ github.run_attempt }}
          # SQLite -shm/-wal files are transient and may disappear between
          # upload-artifact's directory walk and stat(), causing ENOENT.
          # Preserve durable per-partition JUnit, collection manifests and
          # process diagnostics, never race active SQLite sidecars.
          path: |
            ${{ env.QA_WORK }}/pre5-full-backend/summary.json
            ${{ env.QA_WORK }}/pre5-full-backend/*/rc13-partition.json
            ${{ env.QA_WORK }}/pre5-full-backend/*/f14-qa/targets/results/result.xml
            ${{ env.QA_WORK }}/pre5-full-backend/*/f14-qa/targets/scratch/pytest/**/process.log
            ${{ env.QA_WORK }}/pre5-full-backend/*/f14-qa/targets/scratch/pytest/**/restart*.log
            ${{ env.QA_WORK }}/pre5-full-backend/*/f14-qa/targets/scratch/pytest/**/result.json
            ${{ env.QA_WORK }}/pre5-full-backend/*/f14-qa/targets/scratch/pytest/**/execution.json
          retention-days: 30
  frontend:
    needs: reproductions
    if: contains(github.event.head_commit.message, '[pre5-full]')
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: pre5-front-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: pre5-front-${{ github.run_id }}
      - name: Export actual templates and install isolated browser tooling
        run: |
          set -euo pipefail
          QA_WORK="$(mktemp -d "$RUNNER_TEMP/bibliothekar-pre5-front.XXXXXXXX")"
          printf 'QA_WORK=%s\n' "$QA_WORK" >> "$GITHUB_ENV"
          python3 -m venv "$QA_WORK/venv"
          "$QA_WORK/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD" "$QA_WORK/venv/bin/python" qa/rc14/export_ui.py "$QA_WORK/bundle.json"
          npm install --prefix "$QA_WORK/tools" playwright@1.62.1
      - name: Real renderers, German English and mobile desktop without network
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m,mode=1777 \
            -v "$PWD/qa:/qa:ro" -v "$QA_WORK:/evidence" \
            -e NODE_PATH=/evidence/tools/node_modules -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash -euc 'node /qa/rc13/browser.cjs /evidence/bundle.json /evidence/rc13; node /qa/rc14/browser.cjs /evidence/bundle.json /evidence/rc14'
      - name: Preserve frontend results
        if: always() && env.QA_WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre5-full-frontend-${{ github.run_attempt }}
          path: |
            ${{ env.QA_WORK }}/rc13
            ${{ env.QA_WORK }}/rc14
          retention-days: 30

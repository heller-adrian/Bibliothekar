name: RC12 verified regression reuse and container acceptance
on:
  push:
    branches: [release/v1.0.0-rc.12]
    paths: [qa/rc12/container.py, qa/rc11/sitecustomize.py, .github/workflows/qa-rc12-container.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: rc12-acceptance
  cancel-in-progress: true
jobs:
  regression_evidence:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGRESSION_SHA: 033b59251ba0c27e9a5faa8eb7fdf5f30790d770
      REGRESSION_RUN: '40548586537'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove regression source unchanged and all five prior jobs successful
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGRESSION_RUN" > "$RUNNER_TEMP/prior-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REGRESSION_RUN/jobs?per_page=100" > "$RUNNER_TEMP/prior-jobs.json"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'prior-run.json').read_text())
          assert r['head_sha']==os.environ['REGRESSION_SHA'] and r['path']=='.github/workflows/qa-rc12.yml'
          jobs=json.loads((Path(os.environ['RUNNER_TEMP'])/'prior-jobs.json').read_text())['jobs']
          names={'Regression ('+g+')' for g in ['baseline','bootstrap','retention','history','rc12']}
          selected=[j for j in jobs if j['name'] in names]
          assert {j['name'] for j in selected}==names and all(j['conclusion']=='success' for j in selected)
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['REGRESSION_SHA'],'HEAD'],text=True).splitlines()
          allowed={'qa/rc12/container.py','qa/rc11/sitecustomize.py','.github/workflows/qa-rc12.yml','.github/workflows/qa-rc12-container.yml'}
          assert all(p in allowed or p.startswith('docs/') for p in changed),changed
          proof={'source_sha':os.environ['GITHUB_SHA'],'regression_sha':os.environ['REGRESSION_SHA'],'regression_run':os.environ['REGRESSION_RUN'],'changed_files':changed,'unchanged':'app, tests, Dockerfile, requirements and regression harness; only container observer/workflow/docs changed'}
          root=Path(os.environ['RUNNER_TEMP'])/'reused';root.mkdir()
          (root/'reuse-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
          gh run download "$REGRESSION_RUN" --pattern 'rc12-regression-*' --dir "$RUNNER_TEMP/reused"
          python - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'reused';counts={}
          for group in ['baseline','bootstrap','retention','history','rc12']:
              d=root/('rc12-regression-'+group)
              assert json.loads((d/'exit.json').read_text())['returncode']==0
              cases=ET.parse(d/'result.xml').findall('.//testcase')
              assert cases and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases)
              counts[group]=len(cases)
          assert counts=={'baseline':151,'bootstrap':57,'retention':52,'history':71,'rc12':66},counts
          print('Verified unchanged regression payload:',counts)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc12-reused-regressions
          path: ${{ runner.temp }}/reused/
          retention-days: 14
  acceptance:
    name: Container acceptance
    needs: regression_evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: bibliothekar:rc12-acceptance
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y acl
      - name: Validate new and optional removable Compose
        env:
          BIBLIOTHEKAR_APPDATA_DIR: /tmp/rc12/appdata
          BIBLIOTHEKAR_WORKSPACE_DIR: /tmp/rc12/workspace
          BIBLIOTHEKAR_MAIN_LIBRARY_DIR: /tmp/rc12/archive
          BIBLIOTHEKAR_NAS_SOURCE_DIR: /tmp/rc12/source
          BIBLIOTHEKAR_ADMIN_PASSWORD: isolated-ci-password-rc12
        run: docker compose -f compose.example.yaml -f compose.removable.yaml -f compose.nas-source.yaml config -q
      - name: Build exact candidate
        run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "$IMAGE" .
      - name: Real RC12 supervisor, UID568, broad ACL, HTTP, repair and SIGKILL
        run: python qa/rc12/container.py
      - name: RC10/RC11 legacy compatibility and crash regression
        run: python qa/rc11/container.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc12-container-acceptance
          path: |
            ${{ runner.temp }}/rc12-evidence.json
            ${{ runner.temp }}/rc12-container-logs
            ${{ runner.temp }}/rc11-evidence.json
            ${{ runner.temp }}/rc11-container-logs

name: Materialize 0.21.2 archive structure v2

on:
  push:
    branches: [patch/0.21.2]
    paths:
      - tools/materialize_archive_structure_0212_v2.py
      - .github/workflows/materialize-archive-structure-0212-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/0.21.2
          fetch-depth: 0
      - run: python tools/materialize_archive_structure_0212_v2.py
      - run: python -m compileall -q app
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Complete archived structural patch"
            git push origin HEAD:patch/0.21.2
          fi
# one-off retrigger for the final backend fix before cleanup

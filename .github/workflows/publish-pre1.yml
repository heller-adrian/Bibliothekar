name: Publish verified Bibliothekar v1.0.0-pre.1
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After explicit approval type PUBLISH v1.0.0-pre.1'
        required: true
        type: string
permissions:
  contents: write
  packages: write
  actions: read
concurrency:
  group: bibliothekar-v1.0.0-pre.1-publication
  cancel-in-progress: false
jobs:
  publish-pre1:
    if: github.repository == 'heller-adrian/Bibliothekar' && github.ref == 'refs/heads/codex/publish-1.0.0-pre.1' && inputs.confirmation == 'PUBLISH v1.0.0-pre.1'
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: pre1-publish-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPROVE_PUBLISH: ${{ inputs.confirmation }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      BUILD_SHA: 282aeba2dd8464f30c8484034759cbb0fd8e0823
      IMAGE: ghcr.io/heller-adrian/bibliothekar:1.0.0-pre.1
      TAG: v1.0.0-pre.1
      VERSION: 1.0.0-pre.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pre1-publish-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify source identity, accepted evidence, protected releases and free names
        run: |
          set -euo pipefail
          umask 077
          export WORK="$(mktemp -d "$RUNNER_TEMP/bibliothekar-pre1-publish.XXXXXXXX")"
          printf 'WORK=%s\nASSET_DIR=%s/release-assets\n' "$WORK" "$WORK" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$WORK/docker-config"
          mkdir "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          python3 -m unittest discover -s docs/pre1/release -p 'test_*.py' -v
          python3 docs/pre1/release/publish.py prepare --work "$WORK"
      - name: Build frozen version-only source and compare actual embedded bytes
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$BUILD_SHA" --label "org.opencontainers.image.version=$VERSION" -t "$IMAGE" "$WORK/source"
          python3 docs/pre1/release/publish.py verify-image --work "$WORK" --ref "$IMAGE"
          docker image inspect --platform linux/amd64 "$IMAGE" --format '{{.Id}}' > "$WORK/built-platform-id"
      - name: Real versioned supervisor stock and RC14 metadata upgrade before any publication
        run: |
          set -euo pipefail
          mkdir "$WORK/runtime"
          docker pull ghcr.io/heller-adrian/bibliothekar@sha256:86991ef46f1f29a990b63ea3983b1193adfe378247d1202e41fdfd7e21d44b9b
          export RC14_IMAGE=ghcr.io/heller-adrian/bibliothekar@sha256:86991ef46f1f29a990b63ea3983b1193adfe378247d1202e41fdfd7e21d44b9b
          # Run the exact accepted QA scripts, not an unreviewed replacement.
          export RUNNER_TEMP="$WORK/runtime"
          python3 "$WORK/source/qa/pre/startup_container.py"
          python3 "$WORK/source/qa/pre/container.py"
          python3 docs/pre1/release/publish.py runtime --work "$WORK"
      - name: Reserve only new pre.1 tag and push only new pre.1 image
        run: |
          set -euo pipefail
          python3 docs/pre1/release/publish.py reserve --work "$WORK"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE" | tee "$ASSET_DIR/image-push.log"
          DIGEST="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$ASSET_DIR/image-push.log" | tail -1)"
          test "${#DIGEST}" -eq 71
          printf 'DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"
      - name: Actual immutable pull and complete OCI identity verification
        run: |
          set -euo pipefail
          REF="ghcr.io/heller-adrian/bibliothekar@$DIGEST"
          docker pull --platform linux/amd64 "$REF" | tee "$ASSET_DIR/image-pull.log"
          python3 docs/pre1/release/publish.py finish --work "$WORK" --digest "$DIGEST"
          (cd "$ASSET_DIR" && sha256sum --check SHA256SUMS)
      - name: Publish new prerelease and verify independent asset downloads
        run: |
          set -euo pipefail
          python3 docs/pre1/release/publish.py release-guard --work "$WORK" --digest "$DIGEST"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --prerelease --latest=false --notes-file "$ASSET_DIR/RELEASE-NOTES.md" "$ASSET_DIR"/*
          mkdir "$WORK/downloaded-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$WORK/downloaded-release"
          (cd "$WORK/downloaded-release" && sha256sum --check SHA256SUMS)
          python3 docs/pre1/release/publish.py post --work "$WORK" --digest "$DIGEST"
      - name: Preserve publication proof and partial-state diagnostics
        if: always() && env.WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre1-publication-evidence
          retention-days: 30
          path: |
            ${{ env.ASSET_DIR }}/
            ${{ env.WORK }}/publication-result.json
            ${{ env.WORK }}/runtime/*.json
            ${{ env.WORK }}/runtime/*.log
      - name: Remove only this job's registry credentials
        if: always() && env.WORK != ''
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['WORK']);path=Path(os.environ['DOCKER_CONFIG'])
          assert root.parent==Path(os.environ['RUNNER_TEMP']) and root.name.startswith('bibliothekar-pre1-publish.')
          assert path==root/'docker-config' and not path.is_symlink()
          if path.is_dir():shutil.rmtree(path)
          PY

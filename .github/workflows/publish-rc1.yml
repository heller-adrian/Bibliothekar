name: Publish v1.0.0-rc.1 prerelease
on:
  push:
    branches: [release/v1.0.0-rc.1]
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-v1.0.0-rc.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.1
      TAG: v1.0.0-rc.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify accepted application and unused release tag
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python qa/release/verify_source.py | tee release-assets/source-contract.json
          gh api repos/$GITHUB_REPOSITORY/actions/runs/39983880339 > release-assets/accepted-qa.json
          python -c "import json; d=json.load(open('release-assets/accepted-qa.json')); assert d['conclusion']=='success' and d['head_sha']=='ac2e7b8df4b8f7bb3a1582b7cb46d250250cd6ed'"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG --jq length)" = 0
          git rev-parse HEAD HEAD^{tree} > release-assets/source.txt
          docker compose -f docs/rc1/compose.truenas.yaml config -q
          python - <<'PYCODE'
          import ast
          from pathlib import Path
          for p in Path('app').rglob('*.py'):
              ast.parse(p.read_text())
          PYCODE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacement of existing RC image
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'RC image already exists; refusing replacement.' >&2
            exit 1
          fi
      - name: Build exact release tree
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/heller-adrian/bibliothekar:1.0.0-rc.1
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=1.0.0-rc.1
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/heller-adrian/Bibliothekar
            de.bibliothekar.accepted-source=ac2e7b8df4b8f7bb3a1582b7cb46d250250cd6ed
      - name: Verify image bytes and run fresh isolated container
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE" > release-assets/image-inspect.json
          docker run --rm --entrypoint python "$IMAGE" -c 'from app import __version__; assert __version__ == "1.0.0-rc.1"; print(__version__)'
          docker run --rm --entrypoint python "$IMAGE" -c 'from pathlib import Path; import hashlib,json; r=Path("/opt/kamera"); print(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (r/"app").rglob("*") if p.is_file() and "__pycache__" not in p.parts}))' > release-assets/image-app-sha256.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          actual=json.load(open('release-assets/image-app-sha256.json'))
          expected={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('app').rglob('*') if p.is_file() and '__pycache__' not in p.parts}
          assert actual==expected
          PY
          docker run --rm --entrypoint sh "$IMAGE" -c 'python -m pip freeze; dpkg-query -W' > release-assets/installed-packages.txt
          SCRATCH="$RUNNER_TEMP/rc1-smoke"
          mkdir -p "$SCRATCH"/{config,database,logs,workspace,archive}
          sudo chown -R 568:568 "$SCRATCH"
          docker run -d --name rc1-smoke --read-only --tmpfs /tmp:size=64m,mode=1777 -p 127.0.0.1:18080:8080 \
            -e KAMERA_SOURCE_HELPER_ENABLED=false -e BIBLIOTHEKAR_ADMIN_PASSWORD=synthetic-rc-build-smoke-password \
            -e KAMERA_CONFIG=/config/settings.json -e KAMERA_DATABASE_DIR=/database -e KAMERA_REGISTRY_DATABASE=/database/global.sqlite3 \
            -e KAMERA_LOG_DIR=/logs -e KAMERA_WORKSPACE=/workspace -e KAMERA_POOL_PROBE=/workspace -e KAMERA_ARCHIVE_ROOT=/main-library \
            -v "$SCRATCH/config:/config" -v "$SCRATCH/database:/database" -v "$SCRATCH/logs:/logs" \
            -v "$SCRATCH/workspace:/workspace" -v "$SCRATCH/archive:/main-library:ro" "$IMAGE"
          python qa/release/smoke.py | tee release-assets/container-smoke.txt
          docker logs rc1-smoke > release-assets/container.log 2>&1
          docker rm -f rc1-smoke
      - name: Publish and verify registry image
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee release-assets/push.log
          DIGEST="$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*/\1/p' release-assets/push.log | tail -1)"
          test "${#DIGEST}" = 71
          REF="ghcr.io/heller-adrian/bibliothekar@$DIGEST"
          docker pull "$REF"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(docker image inspect "$REF" --format '{{.Id}}')"
          test "$(docker image inspect "$REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf '%s\n' "$REF" > release-assets/IMAGE-DIGEST.txt
          docker buildx imagetools inspect "$REF" --raw > release-assets/registry-manifest.json
          # Pin the distributed install file to the verified digest.
          cp docs/rc1/compose.truenas.yaml release-assets/compose.truenas.yaml
          sed -i "s|$IMAGE|$REF|" release-assets/compose.truenas.yaml
          docker compose -f release-assets/compose.truenas.yaml config -q
          docker save "$IMAGE" | gzip -n > release-assets/bibliothekar-1.0.0-rc.1-linux-amd64.tar.gz
          git archive --format=tar --prefix=bibliothekar-1.0.0-rc.1/ HEAD | gzip -n > release-assets/bibliothekar-1.0.0-rc.1-source.tar.gz
          cp docs/rc1/INSTALL-TRUENAS.md docs/rc1/MANUAL-ACCEPTANCE.md docs/rc1/RELEASE-NOTES.md release-assets/
          cp requirements-rc.constraints.txt Dockerfile requirements.txt release-assets/
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Publish GitHub prerelease with verified install assets
        run: |
          set -euo pipefail
          cat docs/rc1/RELEASE-NOTES.md > "$RUNNER_TEMP/release-body.md"
          printf '\nRelease commit: `%s`\nTree: `%s`\n\nImage: `%s`\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$(cat release-assets/IMAGE-DIGEST.txt)" >> "$RUNNER_TEMP/release-body.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --prerelease --latest=false --notes-file "$RUNNER_TEMP/release-body.md" release-assets/*
          gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG > release-assets/release-verification.json
          python - <<'PY'
          import json
          d=json.load(open('release-assets/release-verification.json'))
          assert d['prerelease'] and not d['draft'] and d['tag_name']=='v1.0.0-rc.1'
          names={a['name'] for a in d['assets']}
          assert {'SHA256SUMS','compose.truenas.yaml','IMAGE-DIGEST.txt','bibliothekar-1.0.0-rc.1-linux-amd64.tar.gz'} <= names
          print(d['html_url'])
          PY
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG --jq .object.sha)" = "$GITHUB_SHA"
      - name: Container diagnostics
        if: always()
        run: |
          docker logs rc1-smoke > release-assets/container-final.log 2>&1 || true
          docker rm -f rc1-smoke >/dev/null 2>&1 || true
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-publication-evidence
          path: |
            release-assets/
            !release-assets/*.tar.gz
          retention-days: 30

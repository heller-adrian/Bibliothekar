name: Materialize 0.21.2 patch v3

on:
  push:
    branches: [patch/0.21.2]
    paths:
      - tools/materialize_0212_v3.py
      - .github/workflows/materialize-0212-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch/0.21.2
          fetch-depth: 0
      - run: python tools/materialize_0212_v3.py
      - run: python -m compileall -q app
      - name: Commit materialized patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Materialize 0.21.2 functional patch"
            git push origin HEAD:patch/0.21.2
          fi

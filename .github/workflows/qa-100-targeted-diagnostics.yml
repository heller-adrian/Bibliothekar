name: Bibliothekar 1.0.0 - targeted regression repairs

on:
  push:
    branches: [ci/1.0.0-targeted-diagnostics, fix/1.0.0-targeted-regressions]
  workflow_dispatch:
    inputs:
      group:
        description: All five unresolved regression groups or one selected group
        type: choice
        required: true
        default: all
        options:
          - all
          - trash-concurrency
          - trash-recovery
          - sd-import
          - version
          - ui-contract
          - publish-contract
          - recovery-consistency
          - large-import

permissions:
  contents: read

concurrency:
  group: bibliothekar-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 5
    steps:
      - name: Confirm safe runner with enough disposable storage
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          available="$(df -Pk /tmp | awk 'END {print $4}')"
          if (( available < 20 * 1024 * 1024 )); then
            echo '::error::Need at least 20 GiB of free space before targeted QA.'
            exit 1
          fi

  diagnose:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.group != 'all' && format('["{0}"]', inputs.group) || '["trash-concurrency","sd-import","ui-contract","publish-contract","recovery-consistency"]') }}
    name: Diagnose ${{ matrix.group }}
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 35
    env:
      GROUP: ${{ matrix.group }}
    defaults:
      run:
        shell: bash
        working-directory: targeted-${{ matrix.group }}
    steps:
      - name: Checkout exact source without repository write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          path: targeted-${{ matrix.group }}
      - name: Verify space and build isolated synthetic Python runtime
        run: |
          set -euo pipefail
          available="$(df -Pk /tmp | awk 'END {print $4}')"
          if (( available < 12 * 1024 * 1024 )); then
            echo '::error::Runner has less than 12 GiB available.'
            exit 1
          fi
          QA_WORK="$(mktemp -d /tmp/bibliothekar-100-diag-$GROUP.XXXXXXXX)"
          echo "QA_WORK=$QA_WORK" >> "$GITHUB_ENV"
          python3 -m venv "$QA_WORK/venv"
          "$QA_WORK/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2==1.4.0
      - name: Exercise only exact historically failed test nodes
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$QA_WORK" \
            "$QA_WORK/venv/bin/python" qa/diagnostics/run.py "$GROUP"
          status=$?
          echo "DIAGNOSTIC_EXIT=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Verify exact case count, candidate revision and unresolved defects
        if: always() && env.QA_WORK != ''
        run: |
          set -euo pipefail
          "$QA_WORK/venv/bin/python" - <<'PY'
          import json,os
          from pathlib import Path
          report=Path(os.environ['QA_WORK'])/'diagnostic-summary.json'
          if not report.is_file():raise SystemExit('Missing trustworthy diagnostic report')
          data=json.loads(report.read_text())
          assert data['group']==os.environ['GROUP']
          assert data['source']==os.environ['GITHUB_SHA']
          assert data['qualification']=='DIAGNOSTIC_ONLY_NOT_FULL_1_0_0_RELEASE_APPROVAL'
          assert data['selection_valid'] is True
          assert data['junit']['tests']==len(data['expected_node_ids'])
          print(json.dumps(data,indent=2))
          if data['status']!='PASS' or int(os.environ.get('DIAGNOSTIC_EXIT','99'))!=0:
              raise SystemExit('Regression remains; see uploaded forensic evidence')
          PY
      - name: Upload detailed independent result and synthetic-only forensic evidence
        if: always() && env.QA_WORK != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            ${{ env.QA_WORK }}/diagnostic-summary.json
            ${{ env.QA_WORK }}/targeted-nodes.json
            ${{ env.QA_WORK }}/targeted-files.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/result.xml
            ${{ env.QA_WORK }}/f14-qa/targets/results/stdout.log
            ${{ env.QA_WORK }}/f14-qa/targets/results/exit.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/diagnostic-selection.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/diagnostic-failures.jsonl
            ${{ env.QA_WORK }}/f14-qa/targets/results/thread-*.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/targets-results.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/targets-incremental.jsonl
            ${{ env.QA_WORK }}/f14-qa/targets/results/execution-deadlines.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/bootstrap.json
            ${{ env.QA_WORK }}/f14-qa/targets/results/command.json
            ${{ env.QA_WORK }}/f14-qa/targets/scratch/pytest/**/process.log
            ${{ env.QA_WORK }}/f14-qa/targets/scratch/pytest/**/restart*.log
            ${{ env.QA_WORK }}/f14-qa/targets/scratch/pytest/**/result.json
            ${{ env.QA_WORK }}/f14-qa/targets/scratch/pytest/**/execution.json
          retention-days: 30
      - name: Reclaim only this job's disposable test files
        if: always() && env.QA_WORK != ''
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "$QA_WORK" in
            /tmp/bibliothekar-100-diag-$GROUP.*) ;;
            *) echo '::error::Unsafe diagnostic scratch path'; exit 1 ;;
          esac
          rm -rf -- "$QA_WORK"

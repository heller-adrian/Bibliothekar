name: Bibliothekar 1.0.0 isolated self-hosted stabilization

on:
  push:
    branches: [ci/1.0.0-selfhosted-stabilization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bibliothekar-stabilize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-regression:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 240
    steps:
      - name: Checkout exact stabilization source including historical tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify runner and source isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" != github-hosted
          git rev-parse HEAD
          git tag -l 'v1.0.0-pre.1' | grep -Fx 'v1.0.0-pre.1'
          command -v docker
          docker version --format '{{.Server.Version}}'
          test "$(python3 -c "from pathlib import Path; print(Path('app/__init__.py').is_file())")" = True
          mkdir -p "$RUNNER_TEMP/bibliothekar-ci-${GITHUB_RUN_ID}/evidence"
          echo "EVIDENCE=$RUNNER_TEMP/bibliothekar-ci-${GITHUB_RUN_ID}/evidence" >> "$GITHUB_ENV"

      - name: Build nonpublished application image and disposable test image
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            -t "bibliothekar-ci-base:${GITHUB_RUN_ID}" .
          docker build -f qa/ci/Dockerfile \
            --build-arg BASE_IMAGE="bibliothekar-ci-base:${GITHUB_RUN_ID}" \
            -t "bibliothekar-ci-test:${GITHUB_RUN_ID}" .
          docker run --rm --network none --read-only \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/tmp" \
            -w /checkout \
            -e PYTHONPATH=/checkout \
            "bibliothekar-ci-test:${GITHUB_RUN_ID}" \
            sh -ec 'command -v exiftool; exiftool -ver; command -v git; python -m pytest --version'

      - name: Full backend regression with ExifTool in isolated container
        id: regression
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network none --read-only \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/tmp" \
            -w /checkout \
            -e PYTHONPATH=/checkout \
            -e PYTEST_ADDOPTS= \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/checkout \
            -e BIBLIOTHEKAR_AUTH_TEST_BYPASS=pytest-isolated \
            "bibliothekar-ci-test:${GITHUB_RUN_ID}" \
            python -m pytest -q -o addopts='' \
              --junitxml=/tmp/backend-junit.xml tests/backend \
            2>&1 | tee "$EVIDENCE/backend-qa.log"

      - name: Independent no-publish integrity record
        if: always()
        shell: bash
        run: |
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "Git ref: $GITHUB_REF"
            echo "Runner: $RUNNER_NAME"
            echo "No source, production DB, appdata or archive mounts were provided to the test container."
            echo "No GitHub release or package is published by this workflow."
          } > "$EVIDENCE/qualification.txt"
          git status --porcelain >> "$EVIDENCE/qualification.txt"

      - name: Save full backend evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bibliothekar-1.0-selfhosted-evidence
          retention-days: 30
          path: ${{ env.EVIDENCE }}/

      - name: Remove disposable CI images
        if: always()
        shell: bash
        run: |
          docker image rm "bibliothekar-ci-test:${GITHUB_RUN_ID}" "bibliothekar-ci-base:${GITHUB_RUN_ID}" || true

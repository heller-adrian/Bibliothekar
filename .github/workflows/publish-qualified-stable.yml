name: Publish qualified stable image

on:
  workflow_call:
    inputs:
      qualified_image_run:
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  promote:
    if: github.repository == 'heller-adrian/Bibliothekar' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFIED_IMAGE_RUN: ${{ inputs.qualified_image_run }}
      IMAGE: ghcr.io/heller-adrian/bibliothekar
      TAG: v1.1.2
      CANDIDATE_TAG: v1.1.2-rc.9
      CANDIDATE_BRANCH: patch/1.1.2-rc9-adoption-navigation
      RELEASE_SOURCE: 9519eca9a8d0aed989299a8ed58cf95ecc294ed8
      RELEASE_DIGEST: sha256:a62c29229192ec9eac433469d500ea57d4c8aebed974c5a3e0d89ba16439ad8a
      RELEASE_QA_RUN: '45717141327'
      EXPECTED_IMAGE_RUN: '45778043461'
      PREVIOUS_TAG: v1.1.1
      PREVIOUS_SOURCE: d18afab745126aaddd8d2a586e62bcc034b42b51
      PREVIOUS_DIGEST: sha256:b47c8422ea53c6c3ec890e8f182643ef4f144a03ec770d1ab979bdf5f9121520
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate promotion evidence
        run: printf 'RELEASE_EVIDENCE=%s/stable-qualification\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify full QA, qualified container and merged source
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALIFIED_IMAGE_RUN" = "$EXPECTED_IMAGE_RUN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test "v$(python -c 'from app import __version__; print(__version__)')" = "$TAG"
          test "$(git ls-remote origin "refs/tags/$CANDIDATE_TAG" | cut -f1)" = "$RELEASE_SOURCE"
          test "$(git ls-remote origin "refs/tags/$PREVIOUS_TAG" | cut -f1)" = "$PREVIOUS_SOURCE"
          git merge-base --is-ancestor "$RELEASE_SOURCE" HEAD
          git diff --name-only "$RELEASE_SOURCE" HEAD -- > "$RUNNER_TEMP/stable-changed-paths"
          python - "$RUNNER_TEMP/stable-changed-paths" <<'PY'
          from pathlib import Path
          import sys
          allowed = {
              ".github/workflows/publish-container.yml",
              ".github/workflows/publish-qualified-stable.yml",
              "qa/release/promote_stable_manifest.py",
              "tests/backend/test_0500_audit_guards.py",
          }
          changed = set(Path(sys.argv[1]).read_text().splitlines())
          assert changed <= allowed, sorted(changed - allowed)
          PY

          evidence="$RELEASE_EVIDENCE"
          mkdir -p "$evidence"/{backend,qa-summary,rc-release}
          qualify_run() {
            local id="$1" workflow="$2"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" |
              jq -er --arg sha "$RELEASE_SOURCE" --arg repo "$GITHUB_REPOSITORY" \
                --arg branch "$CANDIDATE_BRANCH" --arg path ".github/workflows/$workflow" '
                select(.head_sha == $sha and .status == "completed" and .conclusion == "success"
                  and .event == "workflow_dispatch" and .path == $path
                  and .head_branch == $branch and .head_repository.full_name == $repo)
                | .run_attempt'
          }
          qa_attempt="$(qualify_run "$RELEASE_QA_RUN" qa-tests.yml)"
          image_attempt="$(qualify_run "$QUALIFIED_IMAGE_RUN" publish-container.yml)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_QA_RUN/attempts/$qa_attempt/jobs?per_page=100" |
            jq -e '
              (.jobs | map(.name) | sort) == (["adoption-preflight","backend-coverage"]
                + [range(8) | "backend-regression (\(.))"] | sort)
              and all(.jobs[]; .conclusion == "success" and (.labels | index("ubuntu-24.04"))) ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_IMAGE_RUN/attempts/$image_attempt/jobs?per_page=100" |
            jq -e '
              any(.jobs[]; .name == "build-and-push" and .conclusion == "success"
                and (.labels | index("ubuntu-24.04"))
                and any(.steps[]; .name == "Verify the immutable release candidate image with native ZFS"
                  and .conclusion == "success")) ' >/dev/null

          gh run download "$QUALIFIED_IMAGE_RUN" --repo "$GITHUB_REPOSITORY" --name rc112-rc9-qualified-image --dir "$evidence"
          jq -e --arg source "$RELEASE_SOURCE" --arg run "$QUALIFIED_IMAGE_RUN" --arg image "$IMAGE" \
            --arg tag "$CANDIDATE_TAG" --arg digest "$RELEASE_DIGEST" --arg qa "$RELEASE_QA_RUN" '
            . == {source:$source, image_run:$run, image:$image, tag:$tag, digest:$digest, qa_run:$qa}
          ' "$evidence/qualified-image.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CANDIDATE_TAG" |
            jq -e --arg tag "$CANDIDATE_TAG" '.tag_name == $tag and .prerelease and (.draft | not)' >/dev/null
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern qualified-image.json --pattern verified.json --dir "$evidence/rc-release"
          cmp "$evidence/qualified-image.json" "$evidence/rc-release/qualified-image.json"
          cmp "$evidence/verified.json" "$evidence/rc-release/verified.json"

          gh run download "$RELEASE_QA_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'backend-qa-part-*' --dir "$evidence/backend"
          gh run download "$RELEASE_QA_RUN" --repo "$GITHUB_REPOSITORY" --name "backend-coverage-$qa_attempt" --dir "$evidence/qa-summary"
          QA_SOURCE="$RELEASE_SOURCE" python qa/release/verify_backend_coverage.py "$evidence/backend" "$evidence/recomputed.json"
          jq -e --arg sha "$RELEASE_SOURCE" '.source == $sha and .status == "PASS" and .partitions == 8
            and .collected == 2909 and .tested_once == .collected and .read_only_mount == "PASS"' "$evidence/recomputed.json" >/dev/null
          cmp "$evidence/recomputed.json" "$evidence/qa-summary/coverage-summary.json"
          cmp "$evidence/recomputed.json" "$evidence/verified.json"
          grep -Fxq 'Grouped manual SMB work verified the combined ZIP and resumed partial moves after a container restart on native ZFS.' "$evidence/container-smoke.log"
          grep -Fxq 'Released script resumed after a container restart and controlled rollback restored the source on native ZFS.' "$evidence/container-smoke.log"
          grep -Fxq 'Upgrade from RC22 retained the registered archive, receipt and SHA-256 on native ZFS.' "$evidence/container-smoke.log"
          grep -Fxq 'Upgrade from 1.0.0 retained the existing library and normal Workspace access on native ZFS.' "$evidence/container-smoke.log"
          grep -Fxq 'Upgrade from 1.1.1 retained the registered archive, receipt and SHA-256 on native ZFS.' "$evidence/container-smoke.log"
          grep -Fxq 'Prepared RC1 script resumed and registered after upgrade on native ZFS.' "$evidence/container-smoke.log"
          test "$(grep -Fxc 'Bound XMP reference and original/target SHA-256 verified on native ZFS.' "$evidence/container-smoke.log")" = 2

          gh api "repos/$GITHUB_REPOSITORY/releases/latest" |
            jq -e --arg previous "$PREVIOUS_TAG" --arg tag "$TAG" '
              (.tag_name == $previous or .tag_name == $tag) and (.draft | not) and (.prerelease | not)' >/dev/null
          python qa/release/promote_stable_manifest.py check
      - name: Publish stable version aliases and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          tag_ref="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          test -z "$tag_ref" || test "$tag_ref" = "$RELEASE_SOURCE"
          evidence="$RELEASE_EVIDENCE"
          endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          verify_release() {
            jq -e --arg tag "$TAG" --arg source "$RELEASE_SOURCE" --arg digest "$RELEASE_DIGEST" '
              .tag_name == $tag and (.draft | not) and (.prerelease | not)
              and (.body | contains($source) and contains($digest))
              and ([.assets[].name] | index("qualified-image.json") != null and index("verified.json") != null)
            ' >/dev/null
          }
          if gh api --include "$endpoint" > "$evidence/stable.http"; then
            test "$tag_ref" = "$RELEASE_SOURCE"
            awk 'body {print} /^[[:space:]]*$/ {body=1}' "$evidence/stable.http" | verify_release
            exists=true
          else
            grep -Eq '^HTTP/[^ ]+ 404([[:space:]]|$)' "$evidence/stable.http"
            test "$(jq -er .latest "$evidence/registry-before.json")" = "$PREVIOUS_DIGEST"
            exists=false
          fi

          python qa/release/promote_stable_manifest.py version
          if [[ "$exists" == false ]]; then
            cat > "$evidence/stable-release-notes.md" <<NOTES
          Bibliothekar $TAG promotes the qualified RC9 image by its exact OCI manifest digest.

          - Source commit: \`$RELEASE_SOURCE\`
          - Main integration: \`$GITHUB_SHA\`
          - Stable images: \`$IMAGE:$TAG\` and \`$IMAGE:${TAG#v}\`
          - Verified image digest: \`$RELEASE_DIGEST\`
          - Previous latest digest: \`$PREVIOUS_DIGEST\`

          [RC9 qualification](https://github.com/$GITHUB_REPOSITORY/releases/tag/$CANDIDATE_TAG) · [Full Backend QA](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RELEASE_QA_RUN) · [Native ZFS container qualification](https://github.com/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_IMAGE_RUN) · [Stable promotion](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          NOTES
            tag_options=(--target "$RELEASE_SOURCE")
            if [[ -n "$tag_ref" ]]; then tag_options+=(--verify-tag); fi
            gh release create "$TAG" "$evidence/qualified-image.json" "$evidence/verified.json" \
              --repo "$GITHUB_REPOSITORY" "${tag_options[@]}" --title "Bibliothekar $TAG" \
              --notes-file "$evidence/stable-release-notes.md" --latest
          fi
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$RELEASE_SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" | verify_release
          mkdir "$evidence/stable-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern qualified-image.json --pattern verified.json --dir "$evidence/stable-release"
          cmp "$evidence/qualified-image.json" "$evidence/stable-release/qualified-image.json"
          cmp "$evidence/verified.json" "$evidence/stable-release/verified.json"
      - name: Advance latest and verify registry evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$RELEASE_SOURCE"
          test "$(git ls-remote origin "refs/tags/$PREVIOUS_TAG" | cut -f1)" = "$PREVIOUS_SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" |
            jq -e --arg tag "$TAG" '.tag_name == $tag and (.draft | not) and (.prerelease | not)' >/dev/null
          python qa/release/promote_stable_manifest.py latest
          cat "$RELEASE_EVIDENCE/promotion.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-1.1.2-promotion-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_EVIDENCE }}/registry-before.json
            ${{ env.RELEASE_EVIDENCE }}/promotion.json
            ${{ env.RELEASE_EVIDENCE }}/qualified-image.json
            ${{ env.RELEASE_EVIDENCE }}/verified.json
          if-no-files-found: warn

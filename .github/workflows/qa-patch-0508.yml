name: QA patch 0.50.8 (no publishing)

on:
  push:
    branches:
      - patch/0.50.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile Python sources
        run: python -m compileall -q app qa tests/backend
      - name: Run all backend regressions in isolation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q -o addopts='' tests/backend

# Registration stub only. After approval, install as .github/workflows/publish-pre.yml
# on main with a [skip ci] commit; select the prepared branch for the real dispatch.
name: Publish verified Bibliothekar 1.0.0-pre
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After approval select codex/prepare-1.0.0-pre-release and type PUBLISH v1.0.0-pre'
        required: true
        type: string
permissions:
  contents: read
jobs:
  choose-prepared-branch:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    steps:
      - run: |
          echo 'Select codex/prepare-1.0.0-pre-release for the approved publisher.' >&2
          exit 1

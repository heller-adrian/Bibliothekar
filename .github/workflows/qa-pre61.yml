name: Pre6.1 millisecond and manual-rename regression
on:
  push:
    branches: [codex/pre6-1-millisecond-renames]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bibliothekar-pre61-${{ github.ref }}
  cancel-in-progress: false
jobs:
  code-and-contracts:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: pre61-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: pre61-${{ github.run_id }}
      - name: Compile Python, validate edited UI JavaScript and execute contracts
        run: |
          set -euo pipefail
          WORK="$(mktemp -d /tmp/bibliothekar-pre61.XXXXXXXX)"
          python3 -m venv "$WORK/venv"
          "$WORK/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx
          "$WORK/venv/bin/python" -m compileall -q app
          "$WORK/venv/bin/python" -m pytest -q \
            tests/backend/test_pre61_millisecond_burst.py \
            tests/backend/test_pre61_manual_rename.py \
            tests/backend/test_pre61_family_precision.py \
            tests/backend/test_pre6_truenas_acceptance.py \
            tests/backend/test_0501_external_event_deletion.py \
            2>&1 | tee "$WORK/pytest.log"
      - name: Verify source and tests were executed on exact commit
        run: |
          git rev-parse HEAD
          git status --porcelain

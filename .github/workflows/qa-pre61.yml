name: Pre6.1 millisecond and manual rename regression
on:
  push:
    branches: [codex/pre6.1-milliseconds-file-renames]
permissions:
  contents: read
concurrency:
  group: bibliothekar-pre61-tests
  cancel-in-progress: false
jobs:
  pre61-focused:
    runs-on: [self-hosted, Linux, X64, bibliothekar-safe]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run pre6.1 focused tests
        run: |
          set -euo pipefail
          python3 -m compileall -q app
          ENV_PATH="$(mktemp -d /tmp/bibliothekar-pre61.XXXXXXXX)"
          trap 'rm -rf "$ENV_PATH"' EXIT
          python3 -m venv "$ENV_PATH/venv"
          "$ENV_PATH/venv/bin/pip" install -q -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2==1.4.0
          SHELL_JS_PATH="$ENV_PATH/shell.js" "$ENV_PATH/venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from app.ui_shell import BIBLIOTHEKAR_JS
          Path(os.environ["SHELL_JS_PATH"]).write_text(BIBLIOTHEKAR_JS, encoding="utf-8")
          PY
          node --check "$ENV_PATH/shell.js"
          "$ENV_PATH/venv/bin/python" -m pytest -q \
            tests/backend/test_pre61_millisecond_names.py \
            tests/backend/test_pre61_external_rename.py \
            tests/backend/test_pre6_truenas_acceptance.py \
            tests/backend/test_rc14_import.py \
            tests/backend/test_rc1_sd_reimport.py \
            tests/backend/test_0501_external_event_deletion.py

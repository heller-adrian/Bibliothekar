name: RC9 variant B targeted Linux and container
on:
  push:
    branches: [fix/rc9-setup-separation]
permissions:
  contents: read
concurrency:
  group: rc9-setup-qa
  cancel-in-progress: true
jobs:
  targeted-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}
      IMAGE: bibliothekar-rc9-qa:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libimage-exiftool-perl
          python -m pip install -r requirements.txt -c requirements-rc.constraints.txt pytest httpx tinycss2==1.4.0
      - name: Targeted backend regression and syntax
        run: |
          python -m compileall -q app qa/rc7-reset
          pytest -q -o addopts='' tests/backend/test_rc9_setup_separation.py tests/backend/test_rc7_reset_states.py tests/backend/test_rc6_legacy_setup.py tests/backend/test_rc5_practice_followup.py
      - name: Build amd64 image without publishing
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" -c 'from app import __version__; assert __version__=="1.0.0-rc.9"'
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          expected={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('app').rglob('*') if p.is_file()}
          code='from pathlib import Path; import hashlib,json; r=Path("/opt/kamera"); print(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (r/"app").rglob("*") if p.is_file()}))'
          actual=json.loads(subprocess.check_output(['docker','run','--rm','--entrypoint','python',os.environ['IMAGE'],'-c',code],text=True))
          assert expected==actual,(len(expected),len(actual))
          print('Verified app byte identity',len(actual))
          PY
      - name: Isolated real container reset and existing-archive verification
        run: |
          mkdir -p "$RUNNER_TEMP/rc9-evidence"
          for SCENARIO in A-roots A-technical B-missing A-header B-header A-archive; do
            RC7_RESET_CASE="$SCENARIO" RC7_EVIDENCE="$RUNNER_TEMP/rc9-evidence" python qa/rc7-reset/container.py
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc9-targeted-evidence
          retention-days: 14
          path: ${{ runner.temp }}/rc9-evidence/

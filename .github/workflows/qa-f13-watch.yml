name: F13 watch mitigation QA (no publication)
on:
  push:
    branches: [security/f13-ssd-watch]
permissions:
  contents: read
concurrency:
  group: f13-watch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libimage-exiftool-perl
      - run: pip install -r requirements.txt pytest httpx
      - name: Measure synthetic guard resources
        run: python qa/f13/measure.py | tee "$RUNNER_TEMP/performance.json"
      - name: Complete unchanged backend suite plus F13 regressions
        run: pytest -q -p no:cacheprovider -o addopts='' --basetemp="$RUNNER_TEMP/f13-backend" --junitxml="$RUNNER_TEMP/backend.xml" tests/backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f13-backend
          path: |
            ${{ runner.temp }}/performance.json
            ${{ runner.temp }}/backend.xml
            ${{ runner.temp }}/f13-backend/0562-evidence
            ${{ runner.temp }}/f13-backend/**/sigkill-conflict-evidence.json
  original-residual:
    strategy:
      fail-fast: false
      matrix:
        mode: [B, C]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - name: Unchanged original conservation assertion (no XFAIL or softened result)
        env:
          F13_QA_MODE: ${{ matrix.mode }}
          F13_QA_ROOT: ${{ runner.temp }}/f13-original
        run: python qa/f13/run_original.py
      - name: Strict mmap residual conservation assertion
        if: always()
        run: pytest -q -p no:cacheprovider -p qa.f13.f13_mode --basetemp="$RUNNER_TEMP/f13-mmap-${{ matrix.mode }}" --junitxml="$RUNNER_TEMP/mmap-${{ matrix.mode }}.xml" qa/f13/test_residual.py
        env:
          F13_QA_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f13-original-residual-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/f13-original
            ${{ runner.temp }}/mmap-${{ matrix.mode }}.xml
            ${{ runner.temp }}/f13-mmap-${{ matrix.mode }}
  parallel-combinations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - name: Unchanged phase-4 root rename and inventory overlap assertions
        env:
          F13_QA_ROOT: ${{ runner.temp }}/f13-parallel
        run: python qa/f13/run_parallel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f13-parallel-combinations
          path: ${{ runner.temp }}/f13-parallel
